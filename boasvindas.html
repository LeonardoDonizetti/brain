   .concat([{ t: 'prior', s: 'c' }, { t: 'tom', s: 'c' }, { t: 'resumo' }, { t: 'fim' }, { t: 'pronto' }]);
  const primeira = passos.findIndex((p) => p.s);
  const ultima = passos.findIndex((p) => p.t === 'tom');
  { const ir = (location.search.match(/[?&]ir=([a-z]+)/) || [])[1]; const k = ir ? passos.findIndex((p) => p.t === ir) : -1; if (k > 0) i = k; }

  function sair() { location.replace('./'); }

    if (aplicar) { const p = O.plano(resp); window.BrainPrefs.set(Object.assign({}, p.prefs, { onboarding: true, perfil: p.perfil })); }
    else window.BrainPrefs.set({ onboarding: true });
  }

  /* ---------- componentes ---------- */

    const box = document.createElement('div'); box.className = 'opcs';
    if (multi) box.setAttribute('role', 'group');
    const sel = new Set(multi ? (atual || []) : []);
    opcoes.forEach(([v, t]) => {
      const b = document.createElement('button'); b.type = 'button'; b.className = 'opc';
      const s = document.createElement('span'); s.textContent = t; b.appendChild(s);
      if (multi) { const cx = document.createElement('span'); cx.className = 'cx'; cx.innerHTML = ico.check; b.appendChild(cx); b.setAttribute('role', 'checkbox'); b.setAttribute('aria-checked', String(sel.has(v))); }
      else b.setAttribute('aria-pressed', String(atual === v));
      b.onclick = () => {
        if (multi) {
          if (sel.has(v)) sel.delete(v); else { if (max && sel.size >= max) sel.delete([...sel][0]); sel.add(v); }
          [...box.children].forEach((x, n) => x.setAttribute('aria-checked', String(sel.has(opcoes[n][0]))));

  }

  /** Roda de seleção vertical com encaixe (scroll-snap). */
  function roda(rotulo, valores, rotulos, atual, aoMudar) {

    const h = () => el.querySelector('.it').offsetHeight || 56;
    let idx = Math.max(0, valores.indexOf(atual)), trava = false, ate = 0;

  /* ---------- cenas ---------- */

    } else if (p.t === 'horas' || p.t === 'dias') {
      const ehH = p.t === 'horas';
      html = `<h1 class="perg">${ehH ? 'Quanto tempo você quer estudar por dia?' : 'Em quantos dias da semana?'}</h1><p class="sub">${ehH ? 'Pense no que é realista para uma semana comum.' : 'Descanso também faz parte do plano.'}</p><div class="roda-box" id="rb"></div><p class="dica centro" id="rd" style="margin-bottom:.8rem;min-height:1.2em"></p>`;
      depois = (el) => {
        const vals = ehH ? O.HORAS : [1, 2, 3, 4, 5, 6, 7]; const rots = ehH ? vals.map(O.rotuloHoras) : vals.map(String);
        const dica = () => { const t = resp.horas * resp.dias; el.querySelector('#rd').textContent = ehH ? '' : `Total: ${O.rotuloHoras(resp.horas)} × ${resp.dias} = ${String(t).replace('.', ',')} h por semana`; };
        const w = roda(ehH ? 'Horas de estudo por dia' : 'Dias por semana', vals, rots, ehH ? resp.horas : resp.dias, (v) => { resp[ehH ? 'horas' : 'dias'] = v; dica(); });
        el.querySelector('#rb').appendChild(w);
        if (!ehH) { const u = document.createElement('div'); u.className = 'roda-un'; u.textContent = 'dias'; el.querySelector('#rb').appendChild(u); }
        dica();
      };
    } else if (p.t === 'curva') {
      html = `<h1 class="titulo" style="margin-top:1.8rem">Vamos montar o seu plano personalizado</h1>
        <div class="curva"><svg viewBox="0 0 320 250" role="img" aria-label="Ilustração: um plano genérico começa forte e cai; o plano do Brain sobe com constância."><path d="M24 70C70 78 90 200 150 206S210 100 292 44" fill="none" stroke="#b9b0a0" stroke-width="4" stroke-linecap="round"/>
        <path d="M24 196C80 190 120 150 170 112S250 58 292 50" fill="none" stroke="var(--bv-ok)" stroke-width="5" stroke-linecap="round"/>
        <circle cx="24" cy="196" r="6" fill="var(--bv-bg)" stroke="var(--bv-ok)" stroke-width="4"/><circle cx="292" cy="50" r="6" fill="var(--bv-bg)" stroke="var(--bv-ok)" stroke-width="4"/>
        <rect x="14" y="214" width="84" height="26" rx="8" fill="var(--bv-ok)"/><text x="56" y="232" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">Constância</text>
        <rect x="166" y="14" width="140" height="26" rx="8" fill="#7b7468"/><text x="236" y="32" text-anchor="middle" font-size="12.5" font-weight="600" fill="#fff">Plano genérico</text>
        <rect x="150" y="104" width="160" height="26" rx="8" fill="var(--bv-ok)"/><text x="230" y="122" text-anchor="middle" font-size="12.5" font-weight="600" fill="#fff">Seu plano no Brain</text></svg></div>
        <p class="sub centro" style="margin-top:1.2rem">O Brain ajusta metas, lembretes e o tom do coach ao seu ritmo, para você manter o hábito mesmo nos dias ruins.</p><p class="nota centro">Ilustração do conceito, não é uma previsão.</p>`;
    } else if (p.t === 'q') {
      const q = p.q;
      html = `<h1 class="perg">${q.id === 'foco' && n ? n + ', ' + q.texto.charAt(0).toLowerCase() + q.texto.slice(1) : esc(q.texto)}</h1>`;
      depois = (el) => el.appendChild(cartoes(q.opcoes.map((o) => [o.v, o.t]), resp[q.id], false, (v) => { resp[q.id] = v; setTimeout(() => { if (passos[i] === p) avancar(); }, 260); }));
      mostrarProx = false;
    } else if (p.t === 'prior') {
      html = '<h1 class="perg">Se pudesse melhorar até duas áreas agora, quais seriam?</h1><p class="sub">Elas aparecem primeiro nos seus passos iniciais.</p>';
      depois = (el) => { el.insertBefore(cartoes(O.PRIORIDADES, resp.prioridade, true, (v) => { if (v.length) resp.prioridade = v; else delete resp.prioridade; }, 2), el.querySelector('.espaco')); el.querySelector('#sp').addEventListener('click', () => { delete resp.prioridade; avancar(); }); };
      html += '<div class="espaco" style="flex:1"></div><div class="centro"><button class="link" id="sp" type="button"><u>Sem prioridade</u></button></div>';
    } else if (p.t === 'tom') {
      html = '<h1 class="perg">Como o coach deve falar com você?</h1>';
      depois = (el) => el.appendChild(cartoes(O.TONS.map((o) => [o.v, o.t]), resp.tom, false, (v) => { resp.tom = v; setTimeout(() => { if (passos[i] === p) avancar(); }, 260); }));
      mostrarProx = false;
    } else if (p.t === 'resumo') {
      const cs = O.constancia(resp); const cores = ['#d9a05c', '#c9b458', '#8fb36a', '#4f8f62'];
      const rit = (O.RITMOS.find((x) => x[0] === resp.ritmo) || [0, ''])[1];
      const mot = (O.MOTIVOS.find((x) => x[0] === resp.motivo) || [0, ''])[1];
      const mvs = (resp.motivacoes || []).map((v) => O.MOTIVACOES.find((x) => x[0] === v)[1]).join(', ');
      const dicaNivel = cs.pct <= 25 ? 'Você está começando, e tudo bem. Vamos de metas pequenas e de retomar sem culpa quando falhar.' : cs.pct <= 50 ? 'Você já tem partes do hábito. Metas moderadas e o registro diário vão consolidar o resto.' : cs.pct <= 75 ? 'Boa base. Dá para subir as metas aos poucos e usar as revisões a seu favor.' : 'Você já tem constância. O Brain entra para medir, revisar e manter o ritmo.';
      const seg = Math.min(3, Math.floor((Math.max(1, cs.pct) - 1) / 25));
      html = `<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:1rem"><h1 class="titulo" style="text-align:left;margin:1.6rem 0 0">${n ? n + ', seu' : 'Seu'} resumo pessoal</h1>${mascote('festa', 'p')}</div>
        <div class="chips"><span class="chip">${esc(O.rotuloHoras(resp.horas))} por dia</span><span class="chip">${resp.dias} ${resp.dias === 1 ? 'dia' : 'dias'} por semana</span>${rit ? `<span class="chip">${esc(rit)}</span>` : ''}</div>
        <div class="cartao" style="margin-top:1.2rem"><h2>Índice de constância</h2><div class="num-g">${cs.pct}<span style="font-size:1rem;font-weight:500;color:var(--bv-muted)"> / 100</span></div>
        <div class="gauge">${cores.map((x) => `<i style="--c:${x}"></i>`).join('')}<span class="mk" id="mk" style="left:3%"></span></div>
        <div class="gauge-rot">${['Começando', 'Em formação', 'Boa base', 'Firme'].map((x, k) => (k === seg ? `<b>${x}</b>` : `<span>${x}</span>`)).join('')}</div></div>
        <div class="aviso"><b><span aria-hidden="true">!</span>${esc(cs.nivel)}</b><p>${dicaNivel}</p></div>
        <p class="nota">Estimativa calculada só com as suas respostas, para ajustar metas. Não é avaliação nem diagnóstico.</p>
        ${mot ? `<div class="par">${ico.bandeira}<div><small>Meta</small>${esc(mot)}</div></div>` : ''}
        ${mvs ? `<div class="par">${ico.coracao}<div><small>Motivação</small>${esc(mvs)}</div></div>` : ''}`;
      depois = (el) => setTimeout(() => { const m = el.querySelector('#mk'); if (m) m.style.left = Math.max(3, Math.min(97, cs.pct)) + '%'; }, 150);
    } else if (p.t === 'fim') {
      const pl = O.plano(resp); rotulo = 'Continuar';
      html = `<div style="margin-top:1.4rem">${mascote('festa', 'p')}</div><h1 class="titulo" style="text-align:left;margin:.8rem 0 0">${n ? n + ', seu' : 'Seu'} plano está montado</h1>
        <p class="sub">Ajustei isto para você (dá para mudar depois em ⚙):</p><ul class="ajustes">${pl.ajustes.map((a) => `<li>${esc(a)}</li>`).join('')}</ul>
        <h2 class="sec-h">Seus primeiros passos</h2><div class="passos">${pl.passos.map((s, m) => `<a class="passo-c" href="${s.href}"><b>${m + 1}. ${esc(s.titulo)}</b><span>${esc(s.texto)}</span></a>`).join('')}</div><div style="height:.6rem"></div>`;
    } else if (p.t === 'pronto') {
      const G = {
        rotina: ['#c2410c', '#ffedd5', '<circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.5M12 19v2.5M4.6 4.6l1.8 1.8M17.6 17.6l1.8 1.8M2.5 12H5M19 12h2.5M4.6 19.4l1.8-1.8M17.6 6.4l1.8-1.8"/>'],
        estudos: ['#7c3aed', '#f1e9fe', '<path d="M5 4.5A1.5 1.5 0 016.5 3H19v15.5H6.5A1.5 1.5 0 005 20z"/><path d="M5 20a1.5 1.5 0 011.5-1.5H19"/><path d="M9 7.5h6M9 11h4"/>'],
        jornada: ['#be1f68', '#fde7f1', '<path d="M6 21V4"/><path d="M6 4h12l-2.5 4 2.5 4H6"/>'],
        tarefas: ['#087590', '#dff4fa', '<circle cx="12" cy="12" r="9"/><path d="M8 12.2l2.8 2.8 5.2-6"/>'],
        financas: ['#11793a', '#dff6e6', '<rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10.5h18"/><circle cx="16.5" cy="14.8" r="1.2" fill="currentColor"/>'],
        chama: ['#e8590c', '#fff1e0', '<path d="M12.5 2.2c.4 3.2 4.6 5.3 4.6 10.2A5.1 5.1 0 0112 17.6a5.1 5.1 0 01-5.1-5.2c0-1.9.9-3.3 2-4.3.1 1.7.9 2.6 1.8 2.9.5-3 .3-5.6 1.8-8.8z" fill="currentColor" stroke="none"/><path d="M12 21.2c-2.2 0-3.4-1.2-3.4-2.7 0-1 .6-1.7 1.4-2.3.3.8.9 1.2 1.5 1.3.4-.8.5-1.6.4-2.4 1.5.9 3.4 2.1 3.4 3.4 0 1.5-1.4 2.7-3.3 2.7z" fill="#ffd27a" stroke="none" transform="translate(0 -.4)"/>'],
      };
      const ang = [-90, -30, 30, 90, 150, 210];
      const ordem = ['estudos', 'tarefas', 'chama', 'financas', 'jornada', 'rotina'];
      const icones = ordem.map((k, m) => {
        const a = ang[m] * Math.PI / 180, x = (Math.cos(a) * 8.3).toFixed(2), y = (Math.sin(a) * 6.3).toFixed(2);
        const [cor, soft, d] = G[k];
        return `<span class="pr-pos" style="--x:${x}rem;--y:${y}rem"><span class="pr-ic" style="--c:${cor};--s:${soft};--d:${(0.55 + m * 0.11).toFixed(2)}s;--f:${(3 + (m % 3) * 0.6).toFixed(1)}s"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg></span></span>`;
      }).join('');
      const cores = ['#ffb21f', '#1565d8', '#ef5da8', '#2fbf71', '#7c3aed', '#ff7a00'];
      let conf = '';
      for (let m = 0; m < 30; m++) {
        const a = (Math.PI * 2 * m) / 30 + Math.random() * 0.4, dist = 7 + Math.random() * 7;
        conf += `<i style="--dx:${(Math.cos(a) * dist).toFixed(1)}rem;--dy:${(Math.sin(a) * dist * 0.8 - 1).toFixed(1)}rem;--r:${Math.round(Math.random() * 540 - 270)}deg;--c:${cores[m % cores.length]};--w:${(0.35 + Math.random() * 0.35).toFixed(2)}rem;--t:${(0.9 + Math.random() * 0.7).toFixed(2)}s"></i>`;
      }
      html = `<div class="pronto">
        <div class="pr-palco" aria-hidden="true">
          <div class="pr-glow"></div><div class="pr-raios"></div>
          ${icones}
          <div class="pr-masc">${mascote('festa', 'pr')}</div>
          <div class="pr-confete">${conf}</div>
        </div>
        <div class="pr-txt"><h1 class="titulo pr-h">Seu app está pronto!</h1>
          <p class="sub pr-s">${n ? n + ', montei' : 'Montei'} tudo com base nas suas respostas. Vamos começar?</p></div>
        <button class="pill pr-btn" id="entrar" type="button">Prosseguir</button>
      </div>`;
      mostrarProx = false;
    }
    c.innerHTML = html;
    if (depois) depois(c);
    return { el: c, podeIr, mostrarProx, rotulo };
  }

  /* ---------- navegação ---------- */
  let ocupado = false;
  function mostrar(sentido) {
    const p = passos[i]; const palco = $('palco');
    const r = cena(p);
    if (sentido === 'tras' && !reduzido) r.el.classList.add('volta');
    palco.innerHTML = ''; palco.scrollTop = 0; palco.appendChild(r.el);
    $('topo').classList.toggle('vazio', !p.s);
    if (p.s) {
      $('tag').textContent = SEC[p.s];
      const pct = Math.round(((i - primeira) / (ultima - primeira + 1)) * 100);
      $('barra').firstElementChild.style.width = Math.max(4, pct) + '%'; $('barra').setAttribute('aria-valuenow', pct);
    }
    $('rod').hidden = p.t === 'splash' || p.t === 'pronto';
    $('voltar').hidden = i <= 1;
    $('prox').hidden = !r.mostrarProx; $('prox').disabled = !r.podeIr;
    $('prox').textContent = r.rotulo || 'Próximo';
    $('prox').onclick = () => avancar();
    if (p.t === 'fim') concluir(true);
    if (p.t === 'pronto') {
      concluir(true);
      const e = r.el.querySelector('#entrar'); e.onclick = () => sair();
      if (!reduzido) setTimeout(() => { try { if (navigator.vibrate) navigator.vibrate([25, 50, 25]); } catch (x) { /* sem vibração */ } }, 650);
      setTimeout(() => { try { e.focus({ preventScroll: true }); } catch (x) { /* ignora */ } }, reduzido ? 50 : 1900);
    }
    if (p.t === 'splash') {
      r.el.querySelector('#comecar').onclick = () => avancar();
      const im = r.el.querySelector('#imp'); if (im) im.onclick = () => $('arq').click();
    }
    if (document.activeElement && document.activeElement !== document.body && !r.el.contains(document.activeElement)) { try { document.activeElement.blur(); } catch (e) {} }
  }
  function trocar(fn, sentido) {
    if (ocupado) return; ocupado = true;
    const atual = $('palco').firstElementChild;
    const feito = () => { fn(); mostrar(sentido); ocupado = false; };
    if (atual && !reduzido) { atual.classList.add('sai'); setTimeout(feito, 160); } else feito();
  }
  function avancar() { trocar(() => { i = Math.min(i + 1, passos.length - 1); }, 'frente'); }
  $('voltar').addEventListener('click', () => trocar(() => { if (i > 0) i--; }, 'tras'));
  $('pular').addEventListener('click', () => { if (!refazer) concluir(false); sair(); });
  $('arq').addEventListener('change', async (ev) => {
    const f = ev.target.files[0]; ev.target.value = ''; if (!f) return;
    try { await window.BrainLocal.importar(await f.text()); window.BrainPrefs.set({ onboarding: true }); sair(); }
    catch (e) { alert(e && e.message ? e.message : 'Não consegui restaurar esse arquivo.'); }
  });
  if ('serviceWorker' in navigator && location.protocol !== 'file:') window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  mostrar('frente');
})();
</script>
</body>
</html>
