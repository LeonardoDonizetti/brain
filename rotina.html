<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Brain - Rotina</title>
<link rel="stylesheet" href="base.css?v=m1">
<meta name="theme-color" content="#3452e1">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Brain">
<script src="prefs.js"></script>
<script src="texto.js"></script>
<script src="categorias.js"></script>
<script src="estudos.js"></script>
<script src="api-local.js"></script>
<script src="nav.js" defer></script>
<style>
  body { padding-bottom: calc(var(--nav-h) + 6rem); }
  .data-topo { margin: 0 0 .15rem; color: var(--muted); font-size: .9rem; text-transform: capitalize; }
  .dias-nav { display: flex; gap: .4rem; }

  .resumo { display: flex; align-items: center; gap: 1.25rem; padding: 1.1rem 1.25rem; margin-top: 1.25rem; flex-wrap: wrap; }
  .anel { position: relative; width: 6.5rem; height: 6.5rem; flex: none; }
  .anel svg { width: 100%; height: 100%; transform: rotate(0deg); }
  .anel .trilho { fill: none; stroke: var(--bg); stroke-width: 4; }
  .anel .prog { fill: none; stroke: var(--accent); stroke-width: 4; }
  .anel .pct { position: absolute; inset: 0; display: grid; place-items: center; font-size: 1.35rem; font-weight: 750; letter-spacing: -.02em; }
  .resumo-texto { flex: 1; min-width: 10rem; }
  .resumo-texto strong { display: block; font-size: 1.05rem; }
  .resumo-texto span { color: var(--muted); font-size: .9rem; }
  .semana { display: flex; gap: .4rem; align-items: flex-end; margin-top: .85rem; height: 3.6rem; }
  .semana .col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: .25rem; height: 100%; justify-content: flex-end; }
  .semana .trilho-bar { width: 100%; max-width: 1.4rem; flex: 1; background: var(--bg); border-radius: .4rem; display: flex; align-items: flex-end; overflow: hidden; }
  .semana .trilho-bar i { display: block; width: 100%; background: var(--accent); opacity: .55; border-radius: .4rem; }
  .semana .col.hoje .trilho-bar i { opacity: 1; }
  .semana small { font-size: .68rem; color: var(--muted); }
  .semana .col.hoje small { color: var(--accent); font-weight: 700; }

  .bloco { margin-top: 1.5rem; }
  .bloco-topo { display: flex; align-items: center; gap: .7rem; margin-bottom: .6rem; }
  .bloco-icone { width: 2.3rem; height: 2.3rem; border-radius: .8rem; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; flex: none; }
  .bloco-icone svg { width: 1.3rem; height: 1.3rem; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .bloco-topo h3 { margin: 0; font-size: 1.02rem; line-height: 1.2; }
  .bloco-topo small { color: var(--muted); font-size: .8rem; }
  .bloco-cont { margin-left: auto; color: var(--muted); font-size: .85rem; font-weight: 600; }
  .bloco-vazio { padding: .9rem 1rem; color: var(--muted); font-size: .9rem; background: var(--surface); border: 1px dashed var(--line-strong); border-radius: 1.1rem; }

  li.r { grid-template-columns: auto 1fr auto; gap: .85rem; padding: .8rem 1rem; }
  .check { width: 1.8rem; height: 1.8rem; border-radius: 50%; border: 2px solid var(--line-strong); background: var(--surface); display: grid; place-items: center; padding: 0; color: transparent; flex: none; }
  .check svg { width: 1rem; height: 1rem; fill: none; stroke: currentColor; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  .check[aria-checked="true"] { background: var(--ok); border-color: var(--ok); color: #fff; }
  @media (prefers-reduced-motion: no-preference) { .check { transition: background .15s, border-color .15s; } }
  .corpo { background: none; border: none; text-align: left; padding: 0; width: 100%; display: block; }
  .titulo-item { display: block; font-weight: 550; }
  li.r.feito .titulo-item { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--line-strong); }
  .meta { display: flex; flex-wrap: wrap; align-items: center; gap: .4rem; margin-top: .3rem; font-size: .78rem; color: var(--muted); }
  .chip { font-size: .7rem; font-weight: 650; padding: .1rem .5rem; border-radius: 2rem; background: var(--bg); color: var(--muted); }
  .chip.habito { background: var(--accent-soft); color: var(--accent); }
  .chip.renuncia { background: var(--warm-soft); color: var(--warm); }

  .vazio-total { text-align: center; padding: 2rem 1.25rem; margin-top: 1.5rem; }
  .vazio-total h3 { margin: 0 0 .4rem; }
  .vazio-total p { margin: 0 0 1.2rem; color: var(--muted); }
  .vazio-total .acoes { justify-content: center; flex-wrap: wrap; }
  .vazio-total .acoes button { flex: 0 1 auto; padding: .7rem 1.1rem; }

  .fab { position: fixed; z-index: 15; right: max(1rem, calc((100vw - var(--larg)) / 2 + 1rem)); bottom: calc(var(--nav-h) + 1rem); width: 3.5rem; height: 3.5rem; border-radius: 50%; border: none; background: var(--accent); color: var(--on-accent); font-size: 1.9rem; line-height: 1; box-shadow: 0 8px 22px rgba(0, 0, 0, .28); }
  .aviso { position: fixed; z-index: 30; left: 50%; transform: translateX(-50%); bottom: calc(var(--nav-h) + 5.2rem); max-width: 90vw; background: var(--ink); color: var(--bg); padding: .6rem 1rem; border-radius: 2rem; font-size: .88rem; }
  .aviso:empty { display: none; }
  .aviso.erro { background: var(--danger); color: #fff; }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <p class="data-topo" id="data-topo"></p>
      <h1>Rotina</h1>
    </div>
    <div class="dias-nav">
      <button class="icon" id="dia-ant" aria-label="Dia anterior">‹</button>
      <button class="icon" id="dia-prox" aria-label="Próximo dia">›</button>
    </div>
  </header>

  <section class="resumo cartao" id="resumo" hidden>
    <div class="anel">
      <svg viewBox="0 0 42 42" aria-hidden="true">
        <circle class="trilho" cx="21" cy="21" r="15.9155"></circle>
        <circle class="prog" id="anel" cx="21" cy="21" r="15.9155" stroke-dasharray="0 100" stroke-dashoffset="25"></circle>
      </svg>
      <div class="pct num" id="pct">0%</div>
    </div>
    <div class="resumo-texto">
      <strong id="resumo-titulo"></strong>
      <span id="resumo-sub"></span>
      <div class="semana" id="semana" role="img" aria-label="Progresso dos últimos 7 dias"></div>
    </div>
  </section>

  <div id="blocos"></div>

  <section class="vazio-total cartao" id="vazio-total" hidden>
    <h3>Monte a sua rotina</h3>
    <p>Defina rituais da manhã e da noite, hábitos novos que quer construir e o que decidiu deixar de fazer.</p>
    <div class="acoes">
      <button type="button" class="primario" id="usar-modelo">Usar modelo sugerido</button>
      <button type="button" id="criar-primeiro">Criar do zero</button>
    </div>
  </section>
</main>

<button class="fab" id="novo" aria-label="Novo item da rotina">+</button>
<div class="aviso" id="aviso" role="status" aria-live="polite"></div>

<dialog id="dlg">
  <form id="dlg-form">
    <h3 id="dlg-titulo">Novo item</h3>
    <label for="d-titulo">O que é?</label>
    <input id="d-titulo" type="text" maxlength="120" required placeholder="Ex.: Alongar por 10 minutos">
    <label for="d-tipo">Tipo</label>
    <select id="d-tipo">
      <option value="ritual">Ritual</option>
      <option value="habito">Hábito</option>
      <option value="renuncia">Renúncia</option>
    </select>
    <p class="dica" id="d-dica"></p>
    <div id="campo-periodo">
      <label for="d-periodo">Quando</label>
      <select id="d-periodo">
        <option value="manha">Manhã (ritual matinal)</option>
        <option value="dia">Durante o dia</option>
        <option value="noite">Noite (ritual noturno)</option>
      </select>
    </div>
    <label for="d-hora">Horário (opcional)</label>
    <input id="d-hora" type="time">
    <label for="d-min">Duração em minutos (opcional)</label>
    <input id="d-min" type="number" min="1" max="600" step="1" placeholder="Ex.: 10">
    <div class="acoes">
      <button type="button" class="perigo" id="d-apagar" hidden>Apagar</button>
      <button type="button" id="d-cancelar">Cancelar</button>
      <button type="submit" class="primario">Salvar</button>
    </div>
  </form>
</dialog>

<script>
const $ = (id) => document.getElementById(id);
const iso = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const paraData = (s) => { const [a, m, d] = s.split('-').map(Number); return new Date(a, m - 1, d); };
let dia = iso(new Date());
let dados = null;
let editando = null;
const LAPIS = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20l1-4L16.5 4.5a2.1 2.1 0 013 3L8 19l-4 1z"/><path d="M14 7l3 3"/></svg>';

const svg = (c) => `<svg viewBox="0 0 24 24" aria-hidden="true">${c}</svg>`;
const PERIODOS = [
  { id: 'manha', nome: 'Ritual da manhã', sub: 'Comece o dia com intenção', icone: svg('<path d="M3 18h18M7 18a5 5 0 0110 0M12 5v3M5.6 9.6l1.8 1.8M18.4 9.6l-1.8 1.8"/>') },
  { id: 'dia', nome: 'Hábitos do dia', sub: 'Ações essenciais ao longo do dia', icone: svg('<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>') },
  { id: 'noite', nome: 'Ritual da noite', sub: 'Feche o dia e descanse', icone: svg('<path d="M20 14.5A8 8 0 019.5 4 8 8 0 1020 14.5z"/>') },
];
const RENUNCIAS = { nome: 'Renúncias', sub: 'O que você decidiu deixar de fazer', icone: svg('<circle cx="12" cy="12" r="9"/><path d="M5.6 5.6l12.8 12.8"/>') };
const TIPOS = {
  ritual: { nome: 'Ritual', dica: 'Algo que você faz todos os dias.' },
  habito: { nome: 'Hábito', dica: 'Uma ação que você quer fazer sempre. A sequência mostra quantos dias seguidos.' },
  renuncia: { nome: 'Renúncia', dica: 'Algo que você decidiu eliminar ou reduzir (ex.: açúcar, redes sociais). Marque no fim do dia se cumpriu.' },
};
const CHECK = svg('<path d="M5 12.5l4.5 4.5L19 7.5"/>');

let timerAviso;
function aviso(msg, erro = false) {
  const el = $('aviso');
  el.textContent = msg;
  el.classList.toggle('erro', erro);
  clearTimeout(timerAviso);
  if (msg) timerAviso = setTimeout(() => { el.textContent = ''; }, 4000);
}

async function api(url, opcoes) {
  const r = await fetch(url, opcoes);
  let corpo = {};
  try { corpo = await r.json(); } catch (e) { /* resposta sem JSON */ }
  if (!r.ok) {
    const detalhe = Array.isArray(corpo.detail) ? 'Dados inválidos.' : corpo.detail;
    throw new Error(detalhe || 'Algo deu errado. Tente de novo.');
  }
  return corpo;
}
const JSON_HDR = { 'Content-Type': 'application/json' };

async function carregar() {
  try {
    dados = await api(`/api/rotina?data=${dia}`);
  } catch (err) {
    aviso(err.message, true);
    return;
  }
  desenhar();
}

function desenhar() {
  const eHoje = dia === iso(new Date());
  $('data-topo').textContent = (eHoje ? 'Hoje · ' : '') + paraData(dia).toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long' });
  $('dia-prox').disabled = eHoje;

  const { itens, progresso, semana } = dados;
  const vazio = itens.length === 0;
  $('vazio-total').hidden = !vazio;
  $('resumo').hidden = vazio;
  $('blocos').replaceChildren();
  if (vazio) return;

  // resumo
  const pct = progresso.total ? Math.round((progresso.feitos / progresso.total) * 100) : 0;
  $('anel').setAttribute('stroke-dasharray', `${pct} ${100 - pct}`);
  $('pct').textContent = `${pct}%`;
  $('resumo-titulo').textContent = pct === 100 ? 'Dia completo!' : pct >= 50 ? 'Bom ritmo, continue' : 'Vamos começar';
  $('resumo-sub').textContent = `${progresso.feitos} de ${progresso.total} cumpridos`;
  const sem = $('semana');
  sem.replaceChildren();
  semana.forEach((s) => {
    const col = document.createElement('div');
    col.className = 'col' + (s.data === iso(new Date()) ? ' hoje' : '');
    const p = s.total ? Math.round((s.feitos / s.total) * 100) : 0;
    col.innerHTML = '<div class="trilho-bar"><i></i></div><small></small>';
    col.querySelector('i').style.height = `${Math.max(p, 4)}%`;
    col.querySelector('small').textContent = paraData(s.data).toLocaleDateString('pt-BR', { weekday: 'narrow' }).toUpperCase();
    col.title = `${paraData(s.data).toLocaleDateString('pt-BR')}: ${s.feitos}/${s.total}`;
    sem.append(col);
  });

  // blocos do dia (rituais e hábitos) e painel de renúncias
  PERIODOS.forEach((per) => {
    desenharBloco(per, itens.filter((i) => i.periodo === per.id && i.tipo !== 'renuncia'), 'Nada aqui ainda. Toque em + para adicionar.');
  });
  desenharBloco(RENUNCIAS, itens.filter((i) => i.tipo === 'renuncia'), 'Nenhuma renúncia ainda. Ex.: reduzir açúcar, limitar redes sociais.');
}

function desenharBloco(secao, lista, textoVazio) {
  const bloco = document.createElement('section');
  bloco.className = 'bloco';
  bloco.innerHTML = `<div class="bloco-topo"><span class="bloco-icone">${secao.icone}</span><div><h3></h3><small></small></div><span class="bloco-cont num"></span></div>`;
  bloco.querySelector('h3').textContent = secao.nome;
  const minutos = lista.reduce((soma, i) => soma + (i.minutos || 0), 0);
  bloco.querySelector('small').textContent = secao.sub + (minutos ? ` · ${minutos} min` : '');
  bloco.querySelector('.bloco-cont').textContent = lista.length ? `${lista.filter((i) => i.feito).length}/${lista.length}` : '';
  if (!lista.length) {
    const v = document.createElement('div');
    v.className = 'bloco-vazio';
    v.textContent = textoVazio;
    bloco.append(v);
  } else {
    const ul = document.createElement('ul');
    lista.forEach((item) => ul.append(linha(item)));
    bloco.append(ul);
  }
  $('blocos').append(bloco);
}

function linha(item) {
  const li = document.createElement('li');
  li.className = 'r' + (item.feito ? ' feito' : '');
  li.innerHTML = `<button class="check" role="checkbox" type="button">${CHECK}</button><div class="corpo"><span class="titulo-item"></span><span class="meta"></span></div><button type="button" class="lapis" aria-label="Editar item">${LAPIS}</button>`;
  const check = li.querySelector('.check');
  check.setAttribute('aria-checked', String(item.feito));
  check.setAttribute('aria-label', (item.tipo === 'renuncia' ? 'Cumpri hoje: ' : 'Concluir: ') + item.titulo);
  check.onclick = () => alternar(item);
  li.querySelector('.titulo-item').textContent = item.titulo;
  const meta = li.querySelector('.meta');
  const chip = document.createElement('span');
  chip.className = `chip ${item.tipo}`;
  chip.textContent = TIPOS[item.tipo].nome;
  meta.append(chip);
  if (item.hora) { const h = document.createElement('span'); h.className = 'num'; h.textContent = item.hora; meta.append(h); }
  if (item.minutos) { const m = document.createElement('span'); m.className = 'num'; m.textContent = `${item.minutos} min`; meta.append(m); }
  if (item.sequencia >= 2) { const s = document.createElement('span'); s.className = 'num'; s.textContent = `🔥 ${item.sequencia} dias`; meta.append(s); }
  li.querySelector('.lapis').onclick = () => abrirDialogo(item);
  return li;
}

async function alternar(item) {
  try {
    await api('/api/rotina/marcar', { method: 'PUT', headers: JSON_HDR, body: JSON.stringify({ item_id: item.id, data: dia, feito: !item.feito }) });
    await carregar();
  } catch (err) { aviso(err.message, true); }
}

function atualizarDica() {
  $('d-dica').textContent = TIPOS[$('d-tipo').value].dica;
  $('campo-periodo').hidden = $('d-tipo').value === 'renuncia';
}
$('d-tipo').addEventListener('change', atualizarDica);

function abrirDialogo(item) {
  editando = item || null;
  $('dlg-titulo').textContent = item ? 'Editar item' : 'Novo item';
  $('d-titulo').value = item ? item.titulo : '';
  const h = new Date().getHours();
  $('d-periodo').value = item ? item.periodo : (h < 12 ? 'manha' : h < 18 ? 'dia' : 'noite');
  $('d-tipo').value = item ? item.tipo : 'ritual';
  $('d-hora').value = item && item.hora ? item.hora : '';
  $('d-min').value = item && item.minutos ? item.minutos : '';
  $('d-apagar').hidden = !item;
  atualizarDica();
  $('dlg').showModal();
}

$('novo').onclick = () => abrirDialogo(null);
$('criar-primeiro').onclick = () => abrirDialogo(null);
$('d-cancelar').onclick = () => $('dlg').close();

$('d-apagar').onclick = async () => {
  if (!editando || !confirm('Apagar este item e o histórico dele?')) return;
  try {
    await api(`/api/rotina/itens/${editando.id}`, { method: 'DELETE' });
    $('dlg').close();
    carregar();
  } catch (err) { aviso(err.message, true); }
};

$('dlg-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const corpo = JSON.stringify({
    titulo: $('d-titulo').value,
    periodo: $('d-tipo').value === 'renuncia' ? 'dia' : $('d-periodo').value,
    tipo: $('d-tipo').value,
    hora: $('d-hora').value || null,
    minutos: $('d-min').value ? parseInt($('d-min').value, 10) : null,
  });
  try {
    if (editando) await api(`/api/rotina/itens/${editando.id}`, { method: 'PUT', headers: JSON_HDR, body: corpo });
    else await api('/api/rotina/itens', { method: 'POST', headers: JSON_HDR, body: corpo });
    $('dlg').close();
    carregar();
  } catch (err) { aviso(err.message, true); }
});

$('usar-modelo').onclick = async () => {
  try {
    await api('/api/rotina/modelo', { method: 'POST' });
    aviso('Modelo criado. Toque no lápis de qualquer item para editar.');
    carregar();
  } catch (err) { aviso(err.message, true); }
};

function mudarDia(delta) {
  const d = paraData(dia);
  d.setDate(d.getDate() + delta);
  const novo = iso(d);
  if (novo > iso(new Date())) return;
  dia = novo;
  carregar();
}
$('dia-ant').onclick = () => mudarDia(-1);
$('dia-prox').onclick = () => mudarDia(1);

carregar();
</script>
</body>
</html>
