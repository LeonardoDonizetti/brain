<style>
  .data-topo { margin: 0 0 .15rem; color: var(--muted); font-size: .9rem; }
  .sec-topo { display: flex; align-items: baseline; justify-content: space-between; gap: .75rem; }
  .sec-topo a { color: var(--accent); font-size: .85rem; font-weight: 650; text-decoration: none; white-space: nowrap; }
  .bloco { padding: 1rem 1.1rem; }
  .vazio { color: var(--muted); font-size: .92rem; margin: .3rem 0; }

  /* anéis de hoje (estilo Apple Fitness) */
  .aneis { display: grid; grid-template-columns: repeat(3, 1fr); gap: .5rem; text-align: center; }
  .anel { display: block; text-decoration: none; color: inherit; padding: .2rem 0; }
  .anel svg { width: 100%; max-width: 5.6rem; height: auto; display: block; margin: 0 auto; transform: rotate(-90deg); }
  .anel .trilho { stroke: var(--line); }
  .anel .valor { stroke: var(--accent); stroke-linecap: round; }
  .anel .ok { stroke: var(--ok); }
  .anel .centro { position: relative; max-width: 5.6rem; margin: 0 auto; }
  .anel .centro b { position: absolute; inset: 0; display: grid; place-items: center; font-size: 1.05rem; font-weight: 750; letter-spacing: -.02em; }
  .anel .nome { font-size: .8rem; font-weight: 650; margin-top: .45rem; }
  .anel .sub { font-size: .76rem; color: var(--muted); }
  @media (prefers-reduced-motion: no-preference) { .anel .valor { transition: stroke-dashoffset 700ms var(--ease), stroke 200ms ease; } }

  /* destaque numérico + seletor de período */
  .destaque { display: flex; align-items: flex-end; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
  .destaque strong { font-size: 2.1rem; font-weight: 750; letter-spacing: -.01em; line-height: 1; }
  .destaque small { display: block; color: var(--muted); font-size: .82rem; margin-top: .25rem; }
  .delta { font-size: .8rem; font-weight: 650; padding: .15rem .5rem; border-radius: 1rem; background: var(--bg); color: var(--muted); white-space: nowrap; }
  .delta.up { background: var(--ok-soft); color: var(--ok); }
  .delta.down { background: var(--warm-soft); color: var(--warm); }
  .periodo { display: inline-flex; background: var(--bg); border-radius: .5rem; padding: .15rem; gap: .1rem; }
  .periodo button { border: 0; background: transparent; color: var(--muted); font-weight: 650; font-size: .82rem; padding: .3rem .65rem; border-radius: .55rem; min-height: 2rem; }
  .periodo button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }

  /* gráfico de barras */
  .barras { position: relative; margin-top: 1rem; height: 9.5rem; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 2px; align-items: end; padding-left: 1.4rem;
    background:
      linear-gradient(var(--line), var(--line)) 1.4rem 0 / calc(100% - 1.4rem) 1px no-repeat,
      linear-gradient(var(--line), var(--line)) 1.4rem 50% / calc(100% - 1.4rem) 1px no-repeat; }
  .barras .eixo { position: absolute; left: 0; font-size: .68rem; color: var(--muted); line-height: 1; }
  .barra-col { height: 100%; display: flex; align-items: flex-end; justify-content: center; border: 0; background: transparent; padding: 0; min-width: 0; }
  .barra-col i { display: block; width: min(60%, 1.4rem); min-height: 0; background: var(--accent); border-radius: 4px 4px 0 0; }
  .barra-col.hoje i { background: var(--ok); }
  .barra-col[data-v="0"] i { height: 2px !important; background: var(--line-strong); border-radius: 1px; }
  .barra-col:hover i, .barra-col.sel i { filter: brightness(1.12); outline: 2px solid var(--surface); }
  .rotulos { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 2px; padding-left: 1.4rem; margin-top: .3rem; font-size: .7rem; color: var(--muted); text-align: center; }
  .rotulos span { overflow: hidden; white-space: nowrap; }

  /* mapa de constância (estilo GitHub) */
  .mapa-rolagem { overflow-x: auto; padding-bottom: .2rem; }
  .mapa { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 1fr); gap: 3px; width: max-content; margin: .9rem auto 0; }
  .cel { width: 1.05rem; height: 1.05rem; border-radius: 3px; border: 0; padding: 0; background: var(--line); }
  .cel.vazio-dia { background: transparent; pointer-events: none; }
  .cel.n1 { background: color-mix(in srgb, var(--accent) 25%, var(--surface)); }
  .cel.n2 { background: color-mix(in srgb, var(--accent) 50%, var(--surface)); }
  .cel.n3 { background: color-mix(in srgb, var(--accent) 75%, var(--surface)); }
  .cel.n4 { background: var(--accent); }
  .cel.hoje-cel { outline: 2px solid var(--ink); outline-offset: 1px; }
  .legenda { display: flex; align-items: center; justify-content: flex-end; gap: 3px; font-size: .72rem; color: var(--muted); margin-top: .6rem; }
  .legenda .cel { width: .8rem; height: .8rem; pointer-events: none; }
  .legenda span { margin: 0 .3rem; }
  .mapa-info { min-height: 1.3rem; font-size: .85rem; color: var(--ink); margin: .5rem 0 0; }

  /* tabela de tarefas */
  .tabela-rolagem { overflow-x: auto; }
  table.tarefas { width: 100%; border-collapse: collapse; font-size: .92rem; }
  table.tarefas caption { text-align: left; }
  table.tarefas thead th { text-align: left; font-size: .72rem;  color: var(--muted); font-weight: 650; padding: .2rem .4rem .45rem; border-bottom: 1px solid var(--line); }
  table.tarefas th.col-h, table.tarefas td.col-h { width: 3.4rem; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  table.tarefas th.col-c, table.tarefas td.col-c { width: 2.6rem; text-align: right; }
  table.tarefas td { padding: .5rem .4rem; border-bottom: 1px solid var(--line); vertical-align: middle; }
  table.tarefas tr.grupo th { text-align: left; padding: .9rem .4rem .3rem; font-size: .8rem; font-weight: 700; color: var(--ink); border: 0; }
  table.tarefas tr.grupo th small { color: var(--muted); font-weight: 500; margin-left: .3rem; }
  table.tarefas tr.grupo.atrasada th { color: var(--warm); }
  table.tarefas tr:last-child td { border-bottom: 0; }
  table.tarefas tr.feita td.col-t { color: var(--muted); text-decoration: line-through; }
  .check { width: 1.6rem; height: 1.6rem; border-radius: 50%; border: 2px solid var(--line-strong); background: transparent; display: inline-grid; place-items: center; padding: 0; color: transparent; }
  .check svg { width: 1rem; height: 1rem; fill: none; stroke: currentColor; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  .check[aria-pressed="true"] { background: var(--ok); border-color: var(--ok); color: #fff; }
  .mais { display: flex; gap: .6rem; align-items: center; justify-content: space-between; margin-top: .6rem; }
  .mais button { background: transparent; border: 0; color: var(--accent); font-weight: 650; font-size: .85rem; padding: .4rem 0; }

  /* gastos */
  .gastos-topo { display: flex; align-items: flex-end; justify-content: space-between; gap: 1rem; }
  .gastos-topo strong { font-size: 1.8rem; font-weight: 750; letter-spacing: -.01em; line-height: 1; }
  .gastos-topo small { display: block; color: var(--muted); font-size: .82rem; margin-top: .25rem; }
  .gcat { display: grid; grid-template-columns: 6.2rem 1fr auto; gap: .6rem; align-items: center; padding: .35rem 0; font-size: .88rem; }
  .gcat .b { height: .5rem; background: var(--bg); border-radius: 1rem; overflow: hidden; }
  .gcat .b i { display: block; height: 100%; background: var(--accent); border-radius: 1rem; }

  /* dica flutuante */
  #dica { position: fixed; z-index: 30; pointer-events: none; background: var(--ink); color: var(--bg); font-size: .78rem; padding: .35rem .55rem; border-radius: .5rem; max-width: 14rem; opacity: 0; transition: opacity .12s; }
  #dica.on { opacity: 1; }
  .ferias { display: inline-block; margin: .6rem 0 0; padding: .25rem .7rem; border-radius: 1rem; background: var(--warm-soft); color: var(--warm); font-size: .8rem; font-weight: 650; }
  .meta-linha { position: absolute; left: 1.4rem; right: 0; border-top: 2px dashed var(--warm); pointer-events: none; }
  .meta-linha::after { content: "meta"; position: absolute; right: 0; top: -1.05rem; font-size: .66rem; color: var(--warm); font-weight: 700; }
  .meta-txt { margin: .7rem 0 0; font-size: .82rem; color: var(--muted); }
  @media (prefers-reduced-motion: no-preference) {
    @keyframes cresce { from { transform: scaleY(0); } to { transform: scaleY(1); } }
    @keyframes surge { from { opacity: 0; transform: scale(.6); } to { opacity: 1; transform: none; } }
    .barras.anim .barra-col i { transform-origin: bottom; animation: cresce 420ms var(--ease) backwards; animation-delay: calc(var(--i) * 18ms); }
    .mapa.anim .cel { animation: surge 300ms var(--ease) backwards; animation-delay: calc(var(--c) * 14ms); }
    @keyframes estala { 0% { transform: scale(.82); } 60% { transform: scale(1.12); } 100% { transform: scale(1); } }
    .check.estala { animation: estala 260ms var(--ease); }
    table.tarefas tr.saindo td { opacity: .45; transition: opacity 200ms ease; }
    .barra-col i { transition: height 320ms var(--ease); }
    #dica { transform: scale(.96); transition: opacity 125ms ease-out, transform 125ms ease-out; }
    #dica.on { transform: none; }
  }
  .so-leitor { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .rapido { display: flex; gap: .5rem; margin-top: .8rem; }
  .rapido input { flex: 1; min-width: 0; font: inherit; padding: .7rem .85rem; border: 1px solid var(--line-strong); border-radius: .6rem; background: var(--surface); color: var(--ink); min-height: 2.9rem; }
  .rapido button { font: inherit; font-weight: 650; background: var(--accent); color: var(--on-accent); border: 0; border-radius: .6rem; padding: 0 1rem; min-height: 2.9rem; cursor: pointer; }
  #agora .ag-t { margin: 0; font-size: .78rem; color: var(--muted); font-weight: 600; }
  #agora .ag-l { margin: .15rem 0 0; font-size: 1.05rem; font-weight: 600; letter-spacing: -.01em; }
  #agora .ag-s { margin: .15rem 0 0; font-size: .85rem; color: var(--muted); }
  #agora .ag-f { display: flex; justify-content: space-between; align-items: center; margin-top: .6rem; }
  #agora .ag-f a { font-weight: 650; font-size: .85rem; color: var(--accent); text-decoration: none; min-height: 2.75rem; display: inline-flex; align-items: center; }
  .sem-grade { display: grid; grid-template-columns: 1fr 1fr; gap: .5rem; }
  .sem-grade > div { background: var(--bg); border-radius: .55rem; padding: .6rem .75rem; }
  .sem-grade small { display: block; color: var(--muted); font-size: .76rem; font-weight: 600; }
  .sem-grade b { display: block; font-size: 1.15rem; font-weight: 650; letter-spacing: -.01em; margin-top: .1rem; }
  .sem-grade em { font-style: normal; font-size: .76rem; color: var(--muted); }
  .sem-ins { margin: .7rem 0 0; font-size: .9rem; line-height: 1.45; }
</style>
</head>
<body>
<main>
  <p class="data-topo" id="data-topo"></p>
  <h1 id="saudacao">Brain</h1>
  <div data-jogo-cartao style="margin-top:1rem"></div>

  <section class="cartao bloco" id="coach" aria-label="Coach" hidden style="margin-top:1rem"></section>

  <form class="rapido" id="rapido" autocomplete="off">
    <input id="rapido-t" type="text" maxlength="200" placeholder="Nova tarefa (ex.: prova sexta)" aria-label="Nova tarefa">
    <button type="submit" aria-label="Adicionar tarefa">Adicionar</button>
  </form>
  <section class="cartao bloco" id="agora" aria-label="Estudos agora" hidden style="margin-top:.8rem"></section>

  <p class="ferias" id="ferias" hidden>Modo férias ligado: metas pausadas</p>
  <div data-bloco="aneis">
  <h2>Hoje</h2>
  <section class="cartao bloco" aria-label="Resumo de hoje">
    <div class="aneis">
      <a class="anel" href="rotina.html" id="a-rotina"></a>
      <a class="anel" href="tarefas.html" id="a-tarefas"></a>
      <a class="anel" href="jornada.html" id="a-jornada"></a>
    </div>
  </section>
  </div>

  <div data-bloco="semana">
  <h2>Sua semana</h2>
  <section class="cartao bloco" id="semana" aria-label="Resumo dos últimos 7 dias"><p class="vazio">Carregando...</p></section>
  </div>
  <div data-bloco="barras">
  <div class="sec-topo"><h2>Tarefas concluídas</h2><a href="tarefas.html">Ver tarefas</a></div>
  <section class="cartao bloco" aria-label="Tarefas concluídas por dia">
    <div class="destaque">
      <div><strong class="num" id="g-total">0</strong><small id="g-sub">no período</small></div>
      <div style="display:grid;gap:.5rem;justify-items:end">
        <div class="periodo" role="group" aria-label="Período">
          <button type="button" data-d="7" aria-pressed="true">7 dias</button>
          <button type="button" data-d="14" aria-pressed="false">14</button>
          <button type="button" data-d="30" aria-pressed="false">30</button>
        </div>
        <span class="delta" id="g-delta"></span>
      </div>
    </div>
    <div class="barras" id="barras" role="group" aria-label="Barras de tarefas concluídas por dia"></div>
    <div class="rotulos" id="rotulos" aria-hidden="true"></div>
    <p class="meta-txt" id="g-meta"></p>
  </section>
  </div>

  <div data-bloco="constancia">
  <div class="sec-topo"><h2>Constância</h2><a href="jornada.html">Ver jornada</a></div>
  <section class="cartao bloco" aria-label="Constância da rotina nas últimas 12 semanas">
    <div class="mapa-rolagem" id="mapa-rolagem"><div class="mapa" id="mapa" role="group" aria-label="Cumprimento da rotina por dia"></div></div>
    <p class="mapa-info" id="mapa-info" aria-live="polite">Toque em um dia para ver o resultado.</p>
    <div class="legenda" aria-hidden="true"><span>Menos</span><i class="cel"></i><i class="cel n1"></i><i class="cel n2"></i><i class="cel n3"></i><i class="cel n4"></i><span>Mais</span></div>
  </section>
  </div>

  <div data-bloco="tabela">
  <div class="sec-topo"><h2>Próximas tarefas</h2><a href="tarefas.html">Gerenciar</a></div>
  <section class="cartao bloco" aria-label="Tarefas por dia">
    <div class="tabela-rolagem" id="tabela-area"><div class="esq" style="width:40%"></div><div class="esq"></div><div class="esq" style="width:85%"></div><div class="esq" style="width:60%"></div></div>
    <div class="mais"><button type="button" id="alt-feitas" aria-pressed="false">Mostrar concluídas</button><span class="vazio" id="tab-total"></span></div>
  </section>
  </div>

  <div data-bloco="gastos">
  <div class="sec-topo"><h2>Gastos do mês</h2><a href="financas.html">Ver gastos</a></div>
  <section class="cartao bloco" aria-label="Gastos do mês">
    <div class="gastos-topo"><div><strong class="num" id="f-total">-</strong><small id="f-sub"></small></div><span class="delta" id="f-delta"></span></div>
    <div id="f-cats" style="margin-top:.8rem"><div class="esq"></div><div class="esq" style="width:70%"></div></div>
  </section>
  </div>
</main>
<div id="dica" role="status"></div>
<script>
const $ = (id) => document.getElementById(id);
const BRL = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' });
const agora = new Date();
const iso = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const doIso = (s) => { const [a, m, d] = s.split('-').map(Number); return new Date(a, m - 1, d); };
const somar = (d, n) => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() + n); return x; };
const HOJE = iso(agora);
const DIAS_S = ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'];
const fmtCurto = (s) => { const d = doIso(s); return `${DIAS_S[d.getDay()]}, ${String(d.getDate()).padStart(2, '0')}/${String(d.getMonth() + 1).padStart(2, '0')}`; };
const h = agora.getHours();
$('saudacao').textContent = h < 12 ? 'Bom dia' : h < 18 ? 'Boa tarde' : 'Boa noite';
$('data-topo').textContent = agora.toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long' });

const get = (url) => fetch(url).then((r) => (r.ok ? r.json() : Promise.reject(new Error(r.status))));
const plural = (n, a, b) => (n === 1 ? a : b);

// ---- dica flutuante (toque ou mouse) ----
const dica = $('dica');
function mostrarDica(el, texto) {
  dica.textContent = texto;
  dica.classList.add('on');
  const r = el.getBoundingClientRect();
  const w = dica.offsetWidth;
  dica.style.left = Math.max(8, Math.min(innerWidth - w - 8, r.left + r.width / 2 - w / 2)) + 'px';
  dica.style.top = Math.max(8, r.top - dica.offsetHeight - 8) + 'px';
}
const esconderDica = () => dica.classList.remove('on');
document.addEventListener('pointerdown', (e) => { if (!e.target.closest('[data-dica]')) esconderDica(); });
function ligarDica(el, texto) {
  el.dataset.dica = texto;
  el.addEventListener('pointerenter', (e) => { if (e.pointerType === 'mouse') mostrarDica(el, texto); });
  el.addEventListener('pointerleave', (e) => { if (e.pointerType === 'mouse') esconderDica(); });
  el.addEventListener('focus', () => mostrarDica(el, texto));
  el.addEventListener('blur', esconderDica);
}

// ---- anéis ----
function anel(el, { nome, frac, centro, sub, ok }) {
  const R = 40, C = 2 * Math.PI * R;
  const f = Math.max(0, Math.min(1, frac || 0));
  if (!el.firstElementChild) {
    el.innerHTML = `<div class="centro"><svg viewBox="0 0 100 100" aria-hidden="true"><circle class="trilho" cx="50" cy="50" r="${R}" fill="none" stroke-width="10"/><circle class="valor" cx="50" cy="50" r="${R}" fill="none" stroke-width="10" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${C.toFixed(1)}"/></svg><b class="num"></b></div><div class="nome"></div><div class="sub"></div>`;
    el.offsetWidth; // força o início em "vazio" para o anel preencher com animação
  }
  el.querySelector('.valor').style.strokeDashoffset = (C * (1 - f)).toFixed(1);
  el.querySelector('.valor').classList.toggle('ok', !!ok);
  el.querySelector('b').textContent = centro;
  el.querySelector('.nome').textContent = nome;
  el.querySelector('.sub').textContent = sub;
  el.setAttribute('aria-label', `${nome}: ${centro}. ${sub}`);
}
anel($('a-rotina'), { nome: 'Rotina', frac: 0, centro: '-', sub: '' });
anel($('a-tarefas'), { nome: 'Tarefas', frac: 0, centro: '-', sub: '' });
anel($('a-jornada'), { nome: 'Jornada', frac: 0, centro: '-', sub: '' });

const PF = () => (window.BrainPrefs ? window.BrainPrefs.get() : { semana_inicio: 0, meta_diaria: 0, meta_semanal: 0, dias_folga: [], modo_ferias: false, periodo_grafico: 7, home: {} });
let TAREFAS = [];
let periodo = PF().periodo_grafico;
let mostrarFeitas = false;

// ---- barras ----
let animarBarras = true;
function desenharBarras() {
  const hojeD = doIso(HOJE);
  const dias = Array.from({ length: periodo }, (_, i) => iso(somar(hojeD, i - (periodo - 1))));
  const antes = Array.from({ length: periodo }, (_, i) => iso(somar(hojeD, i - (2 * periodo - 1))));
  const contar = (k) => TAREFAS.filter((t) => t.feita && (t.concluida_em || t.data) === k).length;
  const v = dias.map(contar);
  const total = v.reduce((a, b) => a + b, 0);
  const totalAntes = antes.map(contar).reduce((a, b) => a + b, 0);
  $('g-total').textContent = total;
  $('g-sub').textContent = `${plural(total, 'tarefa concluída', 'tarefas concluídas')} em ${periodo} dias`;
  const dl = $('g-delta');
  const dif = total - totalAntes;
  dl.className = 'delta' + (dif > 0 ? ' up' : dif < 0 ? ' down' : '');
  dl.textContent = dif === 0 ? `igual aos ${periodo} dias anteriores` : `${dif > 0 ? '▲ +' : '▼ '}${dif} vs. ${periodo} dias anteriores`;
  const pf = PF();
  const metaD = !pf.modo_ferias && pf.meta_diaria > 0 ? pf.meta_diaria : 0;
  const max = Math.max(1, metaD, ...v);
  const topo = max <= 4 ? max : Math.ceil(max / 2) * 2;
  const caixa = $('barras');
  caixa.classList.toggle('anim', animarBarras);
  animarBarras = false;
  caixa.innerHTML = `<span class="eixo" style="top:0">${topo}</span><span class="eixo" style="top:calc(50% - .35rem)">${topo / 2 % 1 ? '' : topo / 2}</span><span class="eixo" style="bottom:0">0</span>`;
  if (metaD) caixa.insertAdjacentHTML('beforeend', `<span class="meta-linha" style="bottom:${(metaD / topo) * 100}%" aria-hidden="true"></span>`);
  const rot = $('rotulos');
  rot.innerHTML = '';
  dias.forEach((k, i) => {
    const d = doIso(k);
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'barra-col' + (k === HOJE ? ' hoje' : '');
    b.dataset.v = v[i];
    b.style.setProperty('--i', i);
    b.innerHTML = `<i style="height:${(v[i] / topo) * 100}%"></i>`;
    const txt = `${fmtCurto(k)}: ${v[i]} ${plural(v[i], 'tarefa', 'tarefas')}`;
    b.setAttribute('aria-label', txt);
    ligarDica(b, txt);
    b.addEventListener('click', () => mostrarDica(b, txt));
    caixa.append(b);
    const r = document.createElement('span');
    const mostrar = periodo === 7 || (periodo === 14 ? i % 2 === (periodo - 1) % 2 : i % 5 === (periodo - 1) % 5);
    r.textContent = !mostrar ? '' : periodo === 7 ? DIAS_S[d.getDay()] : String(d.getDate());
    rot.append(r);
  });
}
function textoMeta() {
  const pf = PF();
  const alvo = $('g-meta');
  if (pf.modo_ferias || (!pf.meta_diaria && !pf.meta_semanal)) { alvo.textContent = pf.modo_ferias ? 'Metas pausadas (modo férias).' : ''; return; }
  const partes = [];
  const contar = (k) => TAREFAS.filter((t) => t.feita && (t.concluida_em || t.data) === k).length;
  if (pf.meta_diaria) {
    let uteis = 0, bateu = 0;
    for (let i = 0; i < periodo; i++) {
      const d = somar(doIso(HOJE), -i);
      if (pf.dias_folga.includes(d.getDay())) continue;
      uteis++;
      if (contar(iso(d)) >= pf.meta_diaria) bateu++;
    }
    partes.push(`Meta diária ${pf.meta_diaria}: batida em ${bateu} de ${uteis} ${plural(uteis, 'dia', 'dias')}`);
  }
  if (pf.meta_semanal) {
    const hojeD = doIso(HOJE);
    const ini = somar(hojeD, -((hojeD.getDay() - pf.semana_inicio + 7) % 7));
    let n = 0;
    for (let d = ini; d <= hojeD; d = somar(d, 1)) n += contar(iso(d));
    partes.push(`Semana: ${n} de ${pf.meta_semanal}`);
  }
  alvo.textContent = partes.join(' · ');
}
document.querySelectorAll('.periodo button').forEach((b) => b.addEventListener('click', () => {
  periodo = Number(b.dataset.d);
  document.querySelectorAll('.periodo button').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
  esconderDica();
  animarBarras = true;
  desenharBarras();
  textoMeta();
}));

// ---- mapa de constância ----
function marcarPeriodo() { document.querySelectorAll('.periodo button').forEach((x) => x.setAttribute('aria-pressed', String(Number(x.dataset.d) === periodo))); }
let animarMapa = true;
function desenharMapa(dias) {
  const mapa = $('mapa');
  mapa.classList.toggle('anim', animarMapa);
  animarMapa = false;
  mapa.innerHTML = '';
  const porData = new Map(dias.map((d) => [d.data, d]));
  const hojeD = doIso(HOJE);
  const semanas = 12;
  const ini = PF().semana_inicio;
  const primeiro = somar(hojeD, -(((hojeD.getDay() - ini + 7) % 7) + 7 * (semanas - 1)));
  for (let i = 0; i < semanas * 7; i++) {
    const d = somar(primeiro, i);
    const k = iso(d);
    const c = document.createElement('button');
    c.type = 'button';
    c.style.setProperty('--c', Math.floor(i / 7));
    if (d > hojeD) { c.className = 'cel vazio-dia'; c.tabIndex = -1; c.setAttribute('aria-hidden', 'true'); mapa.append(c); continue; }
    const info = porData.get(k);
    const cump = info ? info.cumprimento : null;
    const nivel = cump === null || cump === undefined ? 0 : cump === 0 ? 0 : cump <= 25 ? 1 : cump <= 50 ? 2 : cump <= 75 ? 3 : 4;
    c.className = `cel n${nivel}` + (k === HOJE ? ' hoje-cel' : '');
    const av = info && info.avaliacao ? ` · dia ${info.avaliacao}` : '';
    const txt = cump === null || cump === undefined ? `${fmtCurto(k)}: sem rotina registrada${av}` : `${fmtCurto(k)}: ${cump}% da rotina${av}`;
    c.setAttribute('aria-label', txt);
    ligarDica(c, txt);
    c.addEventListener('click', () => { $('mapa-info').textContent = txt; mostrarDica(c, txt); });
    mapa.append(c);
  }
  const rol = $('mapa-rolagem');
  rol.scrollLeft = rol.scrollWidth;
}

// ---- tabela de tarefas por dia ----
function rotuloGrupo(k) {
  if (k === 'sem') return ['Sem data', ''];
  if (k < HOJE) return ['Atrasadas', ''];
  if (k === HOJE) return ['Hoje', fmtCurto(k)];
  if (k === iso(somar(doIso(HOJE), 1))) return ['Amanhã', fmtCurto(k)];
  return [fmtCurto(k), ''];
}
function desenharTabela() {
  const lista = TAREFAS.filter((t) => mostrarFeitas || !t.feita);
  const pend = TAREFAS.filter((t) => !t.feita).length;
  $('tab-total').textContent = `${pend} ${plural(pend, 'pendente', 'pendentes')}`;
  const area = $('tabela-area');
  if (!lista.length) { area.innerHTML = `<p class="vazio">${TAREFAS.length ? 'Tudo em dia. Nenhuma tarefa pendente.' : 'Você ainda não tem tarefas. Crie a primeira em Tarefas.'}</p>`; return; }
  const ord = lista.slice().sort((a, b) => {
    const ka = a.data ? (a.data < HOJE ? '0' : a.data) : '~'; const kb = b.data ? (b.data < HOJE ? '0' : b.data) : '~';
    return (ka < kb ? -1 : ka > kb ? 1 : 0) || (a.data || '').localeCompare(b.data || '') || (a.hora || '99').localeCompare(b.hora || '99') || a.id - b.id;
  });
  let ultimo = null;
  const linhas = [];
  let html = '<table class="tarefas"><caption class="so-leitor">Tarefas em ordem de dia</caption><thead><tr><th scope="col" class="col-h">Hora</th><th scope="col">Tarefa</th><th scope="col" class="col-c"><span class="so-leitor">Concluir</span></th></tr></thead><tbody>';
  for (const t of ord) {
    const g = t.data ? (t.data < HOJE ? 'atrasada' : t.data) : 'sem';
    if (g !== ultimo) {
      ultimo = g;
      const [nome, sub] = rotuloGrupo(g === 'atrasada' ? '0000-00-00' : g);
      html += `<tr class="grupo ${g === 'atrasada' ? 'atrasada' : ''}"><th scope="colgroup" colspan="3">${g === 'atrasada' ? '⚠ ' : ''}${nome}${sub ? `<small>${sub}</small>` : ''}</th></tr>`;
    }
    const dataAtraso = g === 'atrasada' ? `<small style="color:var(--muted)"> · ${fmtCurto(t.data)}</small>` : '';
    html += `<tr class="${t.feita ? 'feita' : ''}"><td class="col-h">${t.hora || ''}</td><td class="col-t"></td><td class="col-c"><button type="button" class="check" data-id="${t.id}" aria-pressed="${t.feita ? 'true' : 'false'}" aria-label="${t.feita ? 'Reabrir' : 'Concluir'} tarefa"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button></td></tr>`;
    linhas.push([t, dataAtraso]);
  }
  html += '</tbody></table>';
  area.innerHTML = html;
  // títulos entram como texto (sem interpretar HTML)
  const celulas = area.querySelectorAll('td.col-t');
  linhas.forEach(([t, extra], i) => { celulas[i].textContent = t.titulo; if (extra) celulas[i].insertAdjacentHTML('beforeend', extra); });
  area.querySelectorAll('.check').forEach((b) => b.addEventListener('click', async () => {
    if (b.disabled) return;
    b.disabled = true;
    const vaiFicarFeita = b.getAttribute('aria-pressed') !== 'true';
    b.setAttribute('aria-pressed', String(vaiFicarFeita));
    b.classList.add('estala');
    const linha = b.closest('tr');
    linha.classList.toggle('feita', vaiFicarFeita);
    if (vaiFicarFeita && !mostrarFeitas) linha.classList.add('saindo');
    try {
      await fetch(`/api/tarefas/${b.dataset.id}/alternar`, { method: 'PATCH' });
      await new Promise((r) => setTimeout(r, 380)); // deixa o gesto terminar antes de redesenhar
      await carregarTarefas();
      carregarAneis();
    } catch (e) { b.disabled = false; }
  }));
}
$('alt-feitas').addEventListener('click', (e) => {
  mostrarFeitas = !mostrarFeitas;
  e.currentTarget.setAttribute('aria-pressed', String(mostrarFeitas));
  e.currentTarget.textContent = mostrarFeitas ? 'Ocultar concluídas' : 'Mostrar concluídas';
  desenharTabela();
});

// ---- carregamentos ----
let dadosRotina = null, dadosJornada = null;
function desenharAneis() {
  const hojeTar = TAREFAS.filter((t) => t.data === HOJE);
  const feitasHoje = hojeTar.filter((t) => t.feita).length;
  if (dadosRotina) {
    const { feitos, total } = dadosRotina.progresso;
    anel($('a-rotina'), total ? { nome: 'Rotina', frac: feitos / total, centro: `${Math.round((feitos / total) * 100)}%`, sub: `${feitos} de ${total}`, ok: feitos === total } : { nome: 'Rotina', frac: 0, centro: '+', sub: 'Montar rotina' });
  }
  const pf = PF();
  const feitasData = TAREFAS.filter((t) => t.feita && (t.concluida_em || t.data) === HOJE).length;
  const folgaHoje = pf.dias_folga.includes(agora.getDay());
  if (pf.modo_ferias) anel($('a-tarefas'), { nome: 'Tarefas', frac: 0, centro: '☀', sub: 'modo férias' });
  else if (pf.meta_diaria > 0) anel($('a-tarefas'), { nome: 'Tarefas', frac: feitasData / pf.meta_diaria, centro: `${feitasData}/${pf.meta_diaria}`, sub: folgaHoje ? 'dia de folga' : 'meta de hoje', ok: feitasData >= pf.meta_diaria });
  else anel($('a-tarefas'), hojeTar.length ? { nome: 'Tarefas', frac: feitasHoje / hojeTar.length, centro: `${feitasHoje}/${hojeTar.length}`, sub: 'de hoje', ok: feitasHoje === hojeTar.length } : { nome: 'Tarefas', frac: 0, centro: '0', sub: 'nada para hoje' });
  if (dadosJornada) {
    const j = dadosJornada.jornada;
    anel($('a-jornada'), j.dia_atual ? { nome: 'Jornada', frac: Math.min(1, j.dia_atual / j.duracao), centro: j.dia_atual > j.duracao ? '✓' : `${j.dia_atual}`, sub: j.dia_atual > j.duracao ? 'concluída' : `de ${j.duracao} dias`, ok: j.dia_atual >= j.duracao } : { nome: 'Jornada', frac: 0, centro: '+', sub: 'Começar' });
  }
}
function carregarAneis() {
  get(`/api/rotina?data=${HOJE}`).then((d) => { dadosRotina = d; desenharAneis(); }).catch(() => {});
}
function carregarTarefas() {
  return get('/api/tarefas').then((d) => { TAREFAS = d.tarefas; desenharBarras(); textoMeta(); desenharTabela(); desenharAneis(); }).catch(() => { $('tabela-area').innerHTML = '<p class="vazio">Não consegui carregar as tarefas.</p>'; });
}
function aplicarBlocos() {
  const pf = PF();
  document.querySelectorAll('[data-bloco]').forEach((el) => { el.hidden = pf.home && pf.home[el.dataset.bloco] === false; });
  $('ferias').hidden = !pf.modo_ferias;
}
function redesenhar() {
  aplicarBlocos();
  desenharBarras(); textoMeta(); desenharTabela(); desenharAneis();
  if (dadosJornada) desenharMapa(dadosJornada.dias);
}
aplicarBlocos();
marcarPeriodo();
if (window.BrainCoach) { const mc = () => window.BrainCoach.montar($('coach'), 'tudo', 3); mc(); document.addEventListener('visibilitychange', () => { if (!document.hidden) mc(); }); if (window.BrainPrefs) window.BrainPrefs.aoMudar(mc); }
if (window.BrainPrefs) window.BrainPrefs.aoMudar(() => { periodo = PF().periodo_grafico; marcarPeriodo(); redesenhar(); });
carregarAneis();
carregarTarefas();
// ---- adicionar tarefa rápido ----
$('rapido').addEventListener('submit', async (e) => {
  e.preventDefault();
  const titulo = $('rapido-t').value.trim();
  if (!titulo) return;
  try {
    const r = await fetch('/api/tarefas', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ titulo }) });
    const t = await r.json();
    if (!r.ok) throw new Error(typeof t.detail === 'string' ? t.detail : 'Não consegui adicionar.');
    $('rapido-t').value = '';
    const quando = [t.data ? t.data.split('-').reverse().slice(0, 2).join('/') : null, t.hora].filter(Boolean).join(' · ');
    if (window.BrainUI) window.BrainUI.snack(`Adicionada: ${t.titulo}${quando ? ' (' + quando + ')' : ''}`, 'Desfazer', async () => { await fetch(`/api/tarefas/${t.id}`, { method: 'DELETE' }); carregarTarefas(); });
    carregarTarefas();
  } catch (err) { if (window.BrainUI) window.BrainUI.snack(err.message); }
});

// ---- card de estudos: bloco de agora/próximo e revisões ----
async function carregarAgora() {
  const ES = window.BrainEstudos; if (!ES) return;
  let e; try { e = (await get('/api/estudos')).estudos; } catch (x) { return; }
  const sec = $('agora');
  const { atual, proximo, hoje: blocosHoje } = ES.agoraProximo(e.blocos, new Date());
  const dev = ES.revisoesDevidas(e, HOJE);
  const est = ES.estatisticas(e, HOJE);
  if (!e.blocos.length && !dev.length && !est.hoje) { sec.hidden = true; return; }
  let titulo = 'Estudos hoje', linha = '', sub = '';
  if (atual) { titulo = 'Agora'; linha = atual.titulo; sub = `até ${atual.fim}`; }
  else if (proximo) { titulo = 'Próximo bloco'; linha = proximo.titulo; sub = `às ${proximo.ini}`; }
  else if (blocosHoje.length) { titulo = 'Estudos hoje'; linha = 'Blocos de hoje concluídos'; }
  else { linha = est.hoje ? `${ES.fmtMin(est.hoje)} estudados hoje` : 'Sem blocos hoje'; }
  const partes = [];
  if (sub) partes.push(sub);
  if (dev.length) partes.push(`${dev.length} ${dev.length === 1 ? 'revisão pendente' : 'revisões pendentes'}`);
  if (est.hoje && (atual || proximo)) partes.push(`${ES.fmtMin(est.hoje)} hoje`);
  sec.innerHTML = `<p class="ag-t">${titulo}</p><p class="ag-l"></p><p class="ag-s"></p><div class="ag-f"><span></span><a href="estudos.html">${atual ? 'Iniciar foco' : 'Abrir estudos'}</a></div>`;
  sec.querySelector('.ag-l').textContent = linha;
  sec.querySelector('.ag-s').textContent = partes.join(' · ');
  sec.hidden = false;
}
carregarAgora();

// ---- resumo dos últimos 7 dias, comparado com os 7 anteriores ----
async function carregarSemana() {
  const sec = $('semana');
  const dia = (n) => iso(somar(doIso(HOJE), n));
  const ini = dia(-6), antIni = dia(-13), antFim = dia(-7);
  const meses = [...new Set([antIni.slice(0, 7), HOJE.slice(0, 7)])];
  let tar = [], gast = [], est = null, rot = null;
  try {
    const r = await Promise.all([
      get('/api/tarefas'), get('/api/estudos'), get(`/api/rotina?data=${HOJE}`),
      ...meses.map((m) => get(`/api/financas/gastos?mes=${m}`)),
    ]);
    tar = r[0].tarefas; est = r[1].estudos; rot = r[2]; gast = r.slice(3).flatMap((x) => x.gastos);
  } catch (e) { sec.innerHTML = '<p class="vazio">Não consegui montar o resumo.</p>'; return; }
  const dataFeita = (t) => t.concluida_em || t.data;
  const nTar = (a, b) => tar.filter((t) => t.feita && dataFeita(t) >= a && dataFeita(t) <= b).length;
  const tarAtual = nTar(ini, HOJE), tarAnt = nTar(antIni, antFim);
  const minEst = (a, b) => est.sessoes.filter((s) => s.data >= a && s.data <= b).reduce((m, s) => m + s.minutos, 0);
  const estAtual = minEst(ini, HOJE), estAnt = minEst(antIni, antFim);
  const gas = (a, b) => Math.round(gast.filter((g) => g.tipo !== 'receita' && g.data >= a && g.data <= b).reduce((m, g) => m + g.valor, 0) * 100) / 100;
  const gAtual = gas(ini, HOJE), gAnt = gas(antIni, antFim);
  const dias = (rot.semana || []).filter((d) => d.total);
  const rotPct = dias.length ? Math.round(dias.reduce((m, d) => m + d.feitos / d.total, 0) / dias.length * 100) : null;
  const diasEstudo = new Set(est.sessoes.filter((s) => s.data >= ini && s.data <= HOJE).map((s) => s.data)).size;
  if (!tarAtual && !tarAnt && !estAtual && !estAnt && !gAtual && !gAnt && rotPct === null) { sec.innerHTML = '<p class="vazio">Use o app por alguns dias e o resumo da semana aparece aqui.</p>'; return; }
  const dif = (a, b, fmt) => (a === b ? 'igual à anterior' : `${a > b ? '+' : '-'}${fmt(Math.abs(a - b))} vs anterior`);
  const fmtMin = (m) => (window.BrainEstudos ? window.BrainEstudos.fmtMin(m) : `${m} min`);
  const cel = (t, v, e) => `<div><small>${t}</small><b>${v}</b><em>${e || ''}</em></div>`;
  sec.innerHTML = `<div class="sem-grade">
    ${cel('Tarefas concluídas', tarAtual, dif(tarAtual, tarAnt, String))}
    ${cel('Estudo', estAtual ? fmtMin(estAtual) : '0 min', estAtual || estAnt ? dif(estAtual, estAnt, fmtMin) : 'sem sessões')}
    ${cel('Rotina (média)', rotPct === null ? '-' : rotPct + '%', rotPct === null ? 'sem rotina' : 'últimos 7 dias')}
    ${cel('Gastos', BRL.format(gAtual), gAtual || gAnt ? dif(gAtual, gAnt, (v) => BRL.format(v)) : 'sem gastos')}
  </div><p class="sem-ins"></p>`;
  // uma frase só: o que mais merece atenção
  const frases = [];
  if (tarAtual > tarAnt) frases.push([tarAtual - tarAnt, `Você concluiu ${tarAtual - tarAnt} ${tarAtual - tarAnt === 1 ? 'tarefa a mais' : 'tarefas a mais'} que na semana anterior. Bom ritmo.`]);
  if (diasEstudo >= 4) frases.push([5, `Você estudou em ${diasEstudo} dos últimos 7 dias. Constância é o que mais pesa.`]);
  if (estAtual > estAnt && estAnt > 0) frases.push([3, `Seu tempo de estudo subiu em relação à semana anterior.`]);
  if (gAnt > 0 && gAtual > gAnt * 1.3) frases.push([6, `Seus gastos subiram ${Math.round((gAtual / gAnt - 1) * 100)}% em relação aos 7 dias anteriores. Vale olhar as categorias.`]);
  if (rotPct !== null && rotPct >= 80) frases.push([4, 'Sua rotina está firme: média acima de 80% na semana.']);
  if (tarAtual < tarAnt && tarAnt > 0) frases.push([2, 'Você concluiu menos tarefas que na semana anterior. Escolha uma pequena para hoje e comece por ela.']);
  if (!frases.length) frases.push([0, 'Semana tranquila. Escolha uma meta pequena para a próxima.']);
  frases.sort((a, b) => b[0] - a[0]);
  sec.querySelector('.sem-ins').textContent = frases[0][1];
}
carregarSemana();
document.addEventListener('visibilitychange', () => { if (!document.hidden) carregarSemana(); });
document.addEventListener('visibilitychange', () => { if (!document.hidden) carregarAgora(); });

get('/api/jornada?dias=84').then((d) => { dadosJornada = d; desenharAneis(); desenharMapa(d.dias); }).catch(() => desenharMapa([]));

const mesAnterior = (() => { const d = new Date(agora.getFullYear(), agora.getMonth() - 1, 1); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`; })();
Promise.all([get('/api/financas/gastos'), get(`/api/financas/gastos?mes=${mesAnterior}`).catch(() => null)]).then(([g, ant]) => {
  $('f-total').textContent = BRL.format(g.total);
  const nDesp = g.gastos.filter((x) => x.tipo !== 'receita').length;
  $('f-sub').textContent = `${nDesp} ${plural(nDesp, 'lançamento', 'lançamentos')} neste mês`;
  const dl = $('f-delta');
  if (ant && ant.total > 0) {
    const p = Math.round(((g.total - ant.total) / ant.total) * 100);
    dl.className = 'delta' + (p > 0 ? ' down' : p < 0 ? ' up' : '');
    dl.textContent = p === 0 ? 'igual ao mês passado' : `${p > 0 ? '▲ +' : '▼ '}${p}% vs. mês passado`;
  } else dl.hidden = true;
  const caixa = $('f-cats');
  if (!g.por_categoria.length) { caixa.innerHTML = '<p class="vazio">Nenhum gasto registrado neste mês.</p>'; return; }
  const max = g.por_categoria[0].valor;
  caixa.innerHTML = '';
  g.por_categoria.slice(0, 4).forEach((c) => {
    const l = document.createElement('div');
    l.className = 'gcat';
    l.innerHTML = '<span></span><div class="b"><i></i></div><span class="num"></span>';
    l.children[0].textContent = c.categoria;
    l.querySelector('i').style.width = `${(c.valor / max) * 100}%`;
    l.children[2].textContent = BRL.format(c.valor);
    caixa.append(l);
  });
}).catch(() => { $('f-total').textContent = '-'; });
