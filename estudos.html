  #cr-saida h4 { margin: 1rem 0 .2rem; font-size: .95rem; }
  .cr-res { display: flex; flex-wrap: wrap; gap: .35rem; margin-top: .5rem; }
  .planilha-w { overflow: auto; border: 1px solid var(--line); border-radius: .6rem; margin-top: .6rem; max-height: 27rem; -webkit-overflow-scrolling: touch; }
  table.planilha { border-collapse: separate; border-spacing: 0; font-size: .72rem; min-width: 36rem; width: 100%; }
  table.planilha th { position: sticky; top: 0; z-index: 2; background: var(--surface); padding: .4rem .3rem; border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); font-weight: 700; }
  table.planilha td { border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: .15rem .3rem; vertical-align: top; line-height: 1.2; }
  table.planilha td.h { color: var(--muted); white-space: nowrap; width: 2.6rem; font-variant-numeric: tabular-nums; position: sticky; left: 0; z-index: 1; background: var(--surface); }
  table.planilha td.e { color: #fff; font-weight: 650; }
  table.planilha td.e small { display: block; font-weight: 500; opacity: .9; }
  table.planilha td.f { background: var(--bg); color: var(--muted); }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <p class="data-topo" id="data-topo"></p>
      <h1>Estudos</h1>
    </div>
  </header>

  <section class="es" id="coach" aria-label="Coach de estudos" hidden></section>

  <div class="abas" role="group" aria-label="Seções de estudos" id="abas">
    <button type="button" data-aba="hoje" aria-pressed="true">Hoje</button>
    <button type="button" data-aba="semana" aria-pressed="false">Semana</button>
    <button type="button" data-aba="foco" aria-pressed="false">Foco</button>
    <button type="button" data-aba="rev" aria-pressed="false">Revisões</button>
    <button type="button" data-aba="plano" aria-pressed="false">Plano</button>
  </div>
  <div id="painel"></div>
</main>

<dialog id="dlg-bloco">
  <form id="f-bloco">
    <h3 id="b-titulo-d">Bloco</h3>
    <label for="b-titulo">O que é</label>
    <input id="b-titulo" type="text" maxlength="80" required placeholder="Ex.: Física, Academia, Ciclo de estudos">
    <div class="linha2">
      <div><label for="b-ini">Início</label><input id="b-ini" type="time" required></div>
      <div><label for="b-fim">Fim</label><input id="b-fim" type="time" required></div>
    </div>
    <div class="linha2">
      <div><label for="b-dia">Dia</label><select id="b-dia"></select></div>
      <div><label for="b-tipo">Tipo</label><select id="b-tipo"></select></div>
    </div>
    <label for="b-mat">Matéria (opcional)</label>
    <select id="b-mat"></select>
    <label style="display:flex;gap:.5rem;align-items:center;margin-top:.8rem"><input type="checkbox" id="b-todos" style="width:auto"> Repetir de segunda a sexta</label>
    <div class="acoes">
      <button type="button" class="perigo" id="b-apagar">Apagar</button>
      <button type="button" id="b-cancelar">Cancelar</button>
      <button type="submit" class="primario">Salvar</button>
    </div>
  </form>
</dialog>

<dialog id="dlg-mat">
  <form id="f-mat">
    <h3 id="m-titulo-d">Matéria</h3>
    <label for="m-nome">Nome</label>
    <input id="m-nome" type="text" maxlength="40" required>
    <div class="linha2">
      <div><label for="m-prio">Prioridade</label><select id="m-prio"><option value="3">Alta</option><option value="2">Média</option><option value="1">Baixa</option></select></div>
      <div><label for="m-meta">Meta (h/semana)</label><input id="m-meta" type="number" min="0" max="80" step="0.5"></div>
    </div>
    <div class="acoes">
      <button type="button" class="perigo" id="m-apagar">Apagar</button>
      <button type="button" id="m-cancelar">Cancelar</button>
      <button type="submit" class="primario">Salvar</button>
    </div>
  </form>
</dialog>

<dialog id="dlg-vest">
  <form id="f-vest">
    <h3 id="v-titulo-d">Vestibular ou prova</h3>
    <label for="v-nome">Nome</label>
    <input id="v-nome" type="text" maxlength="60" required placeholder="Ex.: ENEM, UFSC, FUVEST">
    <label for="v-data">Data da prova</label>
    <input id="v-data" type="date" required>
    <label style="display:flex;gap:.5rem;align-items:center;margin-top:.8rem"><input type="checkbox" id="v-foco" style="width:auto"> Meu foco principal</label>
    <div class="acoes">
      <button type="button" class="perigo" id="v-apagar">Apagar</button>
      <button type="button" id="v-cancelar">Cancelar</button>
      <button type="submit" class="primario">Salvar</button>
    </div>
  </form>
</dialog>

<dialog id="dlg-rev"><div id="rev-corpo"></div></dialog>
<dialog id="dlg-foto"><div class="zoom"><img id="foto-grande" alt="Foto do meu horário de estudos"></div><div class="acoes"><button type="button" id="foto-fechar">Fechar</button></div></dialog>

<div class="aviso" id="aviso" role="status" aria-live="polite"></div>

<script>
const ES = window.BrainEstudos;
const $ = (id) => document.getElementById(id);
const esc = (t) => String(t == null ? '' : t).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const agora0 = new Date();
const HOJE = ES.isoDe(agora0);
const LAPIS = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20l1-4L16.5 4.5a2.1 2.1 0 013 3L8 19l-4 1z"/><path d="M14 7l3 3"/></svg>';
const JSON_HDR = { 'Content-Type': 'application/json' };
let E = ES.estadoVazio();
let aba = 'hoje';
let diaSel = agora0.getDay();
let previa = null; // { blocos, ignoradas, origem }
try { aba = sessionStorage.getItem('estudos-aba') || 'hoje'; } catch (e) {}

$('data-topo').textContent = agora0.toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long' });

let tAviso;
function aviso(msg, erro = false) {
  const el = $('aviso'); el.textContent = msg; el.className = 'aviso on' + (erro ? ' erro' : '');
  clearTimeout(tAviso); tAviso = setTimeout(() => { el.className = 'aviso'; }, 3500);
}
async function api(url, opcoes) {
  const r = await fetch(url, opcoes);
  const corpo = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(corpo.erro || corpo.detail || 'Algo deu errado.');
  return corpo;
}
async function carregar() {
  try { E = (await api('/api/estudos')).estudos; } catch (err) { aviso(err.message, true); }
  desenhar();
  montarCoach();
}

// ---- modo revisão: um assunto por vez, com recuperação ativa (tentar lembrar antes de avaliar) ----
let FILA = [], FILA_N = 0;
function iniciarRevisao() { FILA = ES.revisoesDevidas(E, HOJE).map((r) => r.id); FILA_N = FILA.length; if (!FILA_N) return; $('dlg-rev').showModal(); desenharRevisao(); }
function desenharRevisao() {
  const c = $('rev-corpo');
  if (!FILA.length) {
    c.innerHTML = `<div class="rev"><p class="rev-k">Revisão concluída</p><h3>Boa sessão</h3><p class="sub">${FILA_N} ${FILA_N === 1 ? 'assunto revisado' : 'assuntos revisados'}. Reveja de novo só quando o app avisar: o espaçamento é o que fixa.</p><div class="linhas"><button class="btn2 pri" id="rev-fim">Fechar</button></div></div>`;
    $('rev-fim').onclick = () => $('dlg-rev').close(); return;
  }
  const r = E.revisoes.find((x) => x.id === FILA[0]); const m = r.materia_id && mat(r.materia_id);
  c.innerHTML = `<div class="rev"><div class="es-topo"><span class="rev-k">${FILA_N - FILA.length + 1} de ${FILA_N}</span><button type="button" class="linkb" id="rev-sair">Sair</button></div>
    <h3 class="rev-t"></h3><p class="sub">${m ? esc(m.nome) + ' · ' : ''}revisão ${r.etapa + 1} de ${ES.INTERVALOS.length}</p>
    <p class="rev-i">Feche os olhos e explique este assunto com as suas palavras, sem olhar o material. Depois avalie com sinceridade.</p>
    <div class="rev-b"><button class="btn2 pri" data-n="bom">Lembrei bem</button><button class="btn2" data-n="dificil">Lembrei pouco</button><button class="btn2 perigo" data-n="esqueci">Esqueci</button></div>
    <p class="sub" style="margin-top:.6rem">Lembrei bem: próxima revisão mais longe. Pouco: repete em 3 dias. Esqueci: recomeça amanhã.</p></div>`;
  c.querySelector('.rev-t').textContent = r.tema;
  $('rev-sair').onclick = () => $('dlg-rev').close();
  c.querySelectorAll('[data-n]').forEach((b) => { b.onclick = async () => { if (window.BrainCelebrar && b.dataset.n !== 'esqueci') window.BrainCelebrar.micro(b, { xp: 8, super: b.dataset.n === 'bom' ? undefined : false }); ES.avaliarRevisao(r, b.dataset.n, HOJE); FILA.shift(); await salvar(); desenharRevisao(); }; });
}
$('dlg-rev').addEventListener('close', () => { try { desenhar && desenhar(); } catch (e) {} });

async function salvar() {
  try { E = (await api('/api/estudos', { method: 'PUT', headers: JSON_HDR, body: JSON.stringify({ estudos: E }) })).estudos; }
  catch (err) { aviso(err.message, true); }
  desenhar();
  montarCoach();
}
function montarCoach() { if (window.BrainCoach) window.BrainCoach.montar($('coach'), 'estudo', 2); }

const mat = (id) => E.materias.find((m) => m.id === id) || null;
const corDe = (b) => { const m = b.materia_id && mat(b.materia_id); return m ? ES.CORES_MATERIA[m.cor] : ({ aula: '#7a4f9e', escola: '#5f6b7a', trabalho: '#1f7f95', treino: '#b0701c', refeicao: '#8a7a4a', deslocamento: '#a08c80', descanso: '#8aa0b8', estudo: '#2f5fb3' }[b.tipo] || '#5f6b7a'); };

// =================================================================== abas
document.querySelectorAll('#abas button').forEach((b) => { b.onclick = () => { aba = b.dataset.aba; try { sessionStorage.setItem('estudos-aba', aba); } catch (e) {} desenhar(); }; });
function desenhar() { if (window.BrainAnim) window.BrainAnim.preservar(desenhar0); else desenhar0(); }
function desenhar0() {
  document.querySelectorAll('#abas button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.aba === aba)));
  const nrev = ES.revisoesDevidas(E, HOJE).length; const br = document.querySelector('#abas [data-aba=rev]'); br.innerHTML = 'Revisões' + (nrev ? `<span class="bd">${nrev}</span>` : '');
  const p = $('painel');
  p.replaceChildren();
  const w = document.createElement('div');
  p.append(w);
  ({ hoje: abaHoje, semana: abaSemana, foco: abaFoco, rev: abaRev, plano: abaPlano }[aba] || abaHoje)(w);
}
const html = (w, s) => { w.insertAdjacentHTML('beforeend', s); if (window.BrainAnim) window.BrainAnim.varrer(w); };

function blocoHtml(b, opcoes = {}) {
  const m = b.materia_id && mat(b.materia_id);
  return `<div class="bl ${opcoes.agora ? 'agora' : ''} ${opcoes.passou ? 'passou' : ''}" style="--c:${corDe(b)}">
    <div class="h">${b.ini}<br>${b.fim}</div><div class="cor"></div>
    <div class="t">${esc(b.titulo)}<small>${ES.TIPOS[b.tipo]}${m && m.nome !== b.titulo ? ' · ' + esc(m.nome) : ''}</small></div>
    ${opcoes.editar ? `<button type="button" class="lapis2" data-edit="${b.id}" aria-label="Editar ${esc(b.titulo)}">${LAPIS}</button>` : opcoes.foco ? `<button type="button" class="btn2" data-foco="${b.materia_id || ''}">Foco</button>` : '<span></span>'}
  </div>`;
}

// =================================================================== HOJE
const ICONE_LIVRO = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 016.5 3H20v15H6.5A2.5 2.5 0 004 20.5z"/><path d="M4 20.5A2.5 2.5 0 006.5 23H20v-5"/><path d="M9 8h7M9 12h5"/></svg>';
function tlHtml(b, o = {}) {
  const m = b.materia_id && mat(b.materia_id);
  return `<div class="tl-i ${o.agora ? 'agora' : ''} ${o.passou ? 'passou' : ''}" style="--c:${corDe(b)}"><div class="tl-h">${b.ini}<br>${b.fim}</div><div class="tl-c"><div style="min-width:0"><b>${esc(b.titulo)}</b><small>${ES.TIPOS[b.tipo]}${m && m.nome !== b.titulo ? ' · ' + esc(m.nome) : ''}</small></div>${o.foco ? `<button type="button" class="btn2" data-foco="${b.materia_id || ''}">Foco</button>` : ''}</div></div>`;
}
function abaHoje(w) {
  const now = new Date();
  const { atual, proximo, hoje } = ES.agoraProximo(E.blocos, now);
  const st = ES.estatisticas(E, HOJE);
  const dev = ES.revisoesDevidas(E, HOJE);
  const v = ES.proximoVestibular(E, HOJE);
  const m = now.getHours() * 60 + now.getMinutes();
  if (!E.blocos.length) {
    html(w, `<div class="es vazio-i">${ICONE_LIVRO}<b>Monte seu plano de estudos</b><p style="margin:0 0 .8rem">Escreva como vai estudar ou tire uma foto da sua rotina e eu monto o cronograma.</p><div class="linhas" style="justify-content:center"><button class="btn2 pri" data-ir="plano">Montar meu plano</button><button class="btn2" id="usar-foto">Montar com uma foto</button></div></div>`);
  } else if (atual) {
    const ini = ES.minutos(atual.ini), fim = ES.minutos(atual.fim);
    html(w, `<div class="hero-es"><div class="k">Agora · ${ES.TIPOS[atual.tipo]}</div><div class="t">${esc(atual.titulo)}</div><div class="r">${atual.ini} às ${atual.fim} · faltam ${ES.fmtMin(fim - m)}</div><div class="bar"><i style="width:${Math.max(3, Math.min(100, ((m - ini) / (fim - ini)) * 100))}%"></i></div>${atual.tipo === 'estudo' ? `<button type="button" data-foco="${atual.materia_id || ''}">Iniciar foco</button>` : ''}${proximo ? `<p class="prox">Depois: ${esc(proximo.titulo)} às ${proximo.ini}</p>` : ''}</div>`);
  } else if (proximo) {
    html(w, `<div class="hero-es hero-neutro"><div class="k" style="color:var(--muted)">Próximo</div><div class="t">${esc(proximo.titulo)}</div><div class="r" style="color:var(--muted)">às ${proximo.ini} · começa em ${ES.fmtMin(ES.minutos(proximo.ini) - m)}</div></div>`);
  } else {
    html(w, `<div class="hero-es hero-neutro"><div class="k" style="color:var(--muted)">Hoje</div><div class="t">Sem mais compromissos</div><div class="r" style="color:var(--muted)">Boa hora para revisar ou descansar.</div></div>`);
  }
  html(w, `<div class="nums"><div><b>${ES.fmtMin(st.hoje)}</b><small>Hoje</small></div><div><b>${ES.fmtMin(st.semana)}</b><small>Semana</small></div><div><b>${st.sequencia}</b><small>Dias seguidos</small></div><div><b>${dev.length}</b><small>Revisões</small></div></div>`);
  if (v) {
    const pct = Math.max(4, Math.min(100, 100 - (v.dias / 180) * 100));
    html(w, `<div class="es vest"><div class="n">${v.dias}</div><div class="rg"><b>${v.dias === 1 ? 'dia' : 'dias'} para ${esc(v.nome)}</b><span class="sub" style="margin:0">${new Date(v.data + 'T12:00').toLocaleDateString('pt-BR', { day: 'numeric', month: 'long', year: 'numeric' })}</span><div class="prog"><i style="width:${pct}%"></i></div></div></div>`);
  }
  if (E.blocos.length) {
    html(w, `<div class="es"><div class="es-topo"><h3>Agenda de hoje</h3><button class="linkb" data-ir="semana">Ver semana</button></div><div class="tl">${hoje.length ? hoje.map((b) => tlHtml(b, { agora: atual && atual.id === b.id, passou: ES.minutos(b.fim) <= m, foco: b.tipo === 'estudo' && ES.minutos(b.fim) > m })).join('') : '<p class="vazio">Nada planejado para hoje.</p>'}</div></div>`);
  }
  ligar(w);
}

// =================================================================== SEMANA
function abaSemana(w) {
  const T0 = 5 * 60, T1 = 24 * 60, agoraMin = new Date().getHours() * 60 + new Date().getMinutes();
  const colunas = ES.ORDEM_SEMANA.map((d) => {
    const blocos = E.blocos.filter((x) => x.dia === d).map((x) => { const i = Math.max(T0, ES.minutos(x.ini)), f = Math.min(T1, ES.minutos(x.fim)); return f > i ? `<i class="${x.tipo === 'estudo' ? 'e' : ''}" style="--c:${corDe(x)};top:${((i - T0) / (T1 - T0)) * 100}%;height:${((f - i) / (T1 - T0)) * 100}%"></i>` : ''; }).join('');
    const linha = d === agora0.getDay() && agoraMin >= T0 ? `<u style="top:${((agoraMin - T0) / (T1 - T0)) * 100}%"></u>` : '';
    return `<button type="button" class="gs-d ${d === agora0.getDay() ? 'hoje' : ''} ${d === diaSel ? 'sel' : ''}" data-dia="${d}" aria-label="${ES.DIAS[d]}">${blocos}${linha}</button>`;
  }).join('');
  html(w, `<div class="es"><div class="es-topo"><h3>Minha semana</h3><span class="sub" style="margin:0">toque num dia</span></div><div class="gs-cab"><span></span>${ES.ORDEM_SEMANA.map((d) => `<span class="${d === agora0.getDay() ? 'h' : ''}">${ES.DIAS_CURTO[d]}</span>`).join('')}</div><div class="grade-sem"><div class="gs-h">${[6, 9, 12, 15, 18, 21].map((h) => `<span style="top:${((h * 60 - T0) / (T1 - T0)) * 100}%">${h}h</span>`).join('')}</div>${colunas}</div><p class="dica2" style="margin:.5rem 0 0">Blocos de estudo em cores fortes; o resto, mais claro.</p></div>`);
  const lista = E.blocos.filter((b) => b.dia === diaSel).sort((a, b) => ES.minutos(a.ini) - ES.minutos(b.ini));
  const conf = ES.conflitos(E.blocos).filter(([a]) => a.dia === diaSel);
  html(w, `<div class="es"><div class="es-topo"><h3>${ES.DIAS[diaSel].charAt(0).toUpperCase() + ES.DIAS[diaSel].slice(1)}</h3><button class="linkb" id="novo-bloco">+ Novo bloco</button></div>${conf.length ? `<div class="aviso2">Há blocos que se sobrepõem neste dia (${esc(conf[0][0].titulo)} e ${esc(conf[0][1].titulo)}).</div>` : ''}${lista.length ? lista.map((b) => blocoHtml(b, { editar: true })).join('') : '<p class="vazio">Nenhum bloco neste dia.</p>'}</div>`);
  // horas de estudo planejadas por dia
  const horas = ES.ORDEM_SEMANA.map((d) => E.blocos.filter((b) => b.dia === d && b.tipo === 'estudo').reduce((s, b) => s + ES.minutos(b.fim) - ES.minutos(b.ini), 0));
  const mx = Math.max(60, ...horas);
  html(w, `<div class="es"><h3>Estudo planejado por dia</h3><p class="sub">Total: ${ES.fmtMin(horas.reduce((a, b) => a + b, 0))} por semana</p><div class="mini">${ES.ORDEM_SEMANA.map((d, i) => `<div><span>${horas[i] ? ES.fmtMin(horas[i]).replace(' ', '') : ''}</span><i style="height:${(horas[i] / mx) * 70}%"></i><span>${ES.DIAS_CURTO[d]}</span></div>`).join('')}</div></div>`);
  w.querySelectorAll('[data-dia]').forEach((b) => { b.onclick = () => { diaSel = Number(b.dataset.dia); desenhar(); }; });
  $('novo-bloco').onclick = () => abrirBloco(null);
  w.querySelectorAll('[data-edit]').forEach((b) => { b.onclick = () => abrirBloco(E.blocos.find((x) => x.id === Number(b.dataset.edit))); });
}

let editBloco = null;
function abrirBloco(b) {
  editBloco = b;
  $('b-titulo-d').textContent = b ? 'Editar bloco' : 'Novo bloco';
  $('b-dia').innerHTML = ES.ORDEM_SEMANA.map((d) => `<option value="${d}">${ES.DIAS[d]}</option>`).join('');
  $('b-tipo').innerHTML = Object.entries(ES.TIPOS).map(([k, v]) => `<option value="${k}">${v}</option>`).join('');
  $('b-mat').innerHTML = '<option value="">Nenhuma</option>' + E.materias.map((m) => `<option value="${m.id}">${esc(m.nome)}</option>`).join('');
  $('b-titulo').value = b ? b.titulo : '';
  $('b-ini').value = b ? b.ini : '';
  $('b-fim').value = b ? b.fim : '';
  $('b-dia').value = String(b ? b.dia : diaSel);
  $('b-tipo').value = b ? b.tipo : 'estudo';
  $('b-mat').value = b && b.materia_id ? String(b.materia_id) : '';
  $('b-todos').checked = false; $('b-todos').parentElement.hidden = !!b;
  $('b-apagar').hidden = !b;
  $('dlg-bloco').showModal();
}
$('b-cancelar').onclick = () => $('dlg-bloco').close();
$('b-apagar').onclick = async () => { if (!editBloco || !confirm('Apagar este bloco?')) return; E.blocos = E.blocos.filter((x) => x.id !== editBloco.id); $('dlg-bloco').close(); await salvar(); };
$('f-bloco').addEventListener('submit', async (e) => {
  e.preventDefault();
  const ini = $('b-ini').value, fim = $('b-fim').value;
  if (ES.minutos(fim) <= ES.minutos(ini)) { aviso('O fim precisa ser depois do início.', true); return; }
  const base = { titulo: $('b-titulo').value.trim(), ini, fim, tipo: $('b-tipo').value, materia_id: $('b-mat').value ? Number($('b-mat').value) : null };
  if (editBloco) Object.assign(editBloco, base, { dia: Number($('b-dia').value) });
  else for (const d of ($('b-todos').checked ? [1, 2, 3, 4, 5] : [Number($('b-dia').value)])) E.blocos.push({ id: ES.novoId(E), dia: d, ...base });
  $('dlg-bloco').close();

});

// =================================================================== FOCO (cronômetro)
const CH_FOCO = 'brain-foco';
const lerFoco = () => { try { return JSON.parse(localStorage.getItem(CH_FOCO)); } catch (e) { return null; } };
const gravarFoco = (f) => { try { if (f) localStorage.setItem(CH_FOCO, JSON.stringify(f)); else localStorage.removeItem(CH_FOCO); } catch (e) {} };
let duracaoSel = 25, matSel = '';
let tick = null, wake = null;
const mmss = (ms) => { const s = Math.max(0, Math.ceil(ms / 1000)); return `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`; };

function bipe() {
  try { if (navigator.vibrate) navigator.vibrate([250, 120, 250]); } catch (e) {}
  try { const c = new (window.AudioContext || window.webkitAudioContext)(); [0, 0.25, 0.5].forEach((t) => { const o = c.createOscillator(), g = c.createGain(); o.frequency.value = 880; g.gain.value = 0.15; o.connect(g); g.connect(c.destination); o.start(c.currentTime + t); o.stop(c.currentTime + t + 0.15); }); } catch (e) {}
}
async function registrar(min, materiaId) {
  if (min < 1) return;
  E.sessoes.push({ id: ES.novoId(E), data: ES.isoDe(new Date()), minutos: Math.min(720, Math.round(min)), materia_id: materiaId || null });
  if (window.BrainCelebrar && min >= 15) window.BrainCelebrar.micro(null, { xp: 10, super: true });
  await salvar();
}
function liberarTela() { try { if (wake) { wake.release(); wake = null; } } catch (e) {} }
async function manterTela() { try { if (navigator.wakeLock) wake = await navigator.wakeLock.request('screen'); } catch (e) {} }

function iniciarFoco() {
  gravarFoco({ fim: Date.now() + duracaoSel * 60000, total: duracaoSel, materia_id: matSel ? Number(matSel) : null, restante: null });
  manterTela(); desenhar();
}
function pausarFoco() {
  const f = lerFoco(); if (!f) return;
  if (f.restante == null) { f.restante = Math.max(0, f.fim - Date.now()); liberarTela(); } else { f.fim = Date.now() + f.restante; f.restante = null; manterTela(); }
  gravarFoco(f); desenhar();
}
async function pararFoco(automatico) {
  const f = lerFoco(); if (!f) return;
  const restante = f.restante != null ? f.restante : Math.max(0, f.fim - Date.now());
  const feito = automatico ? f.total : Math.floor((f.total * 60000 - restante) / 60000);
  gravarFoco(null); liberarTela(); clearInterval(tick); tick = null;
  if (automatico) { bipe(); aviso(`Foco concluído: ${f.total} min registrados. Faça uma pausa de 5 minutos.`); }
  else if (feito >= 1) aviso(`${feito} min registrados.`); else aviso('Sessão descartada (menos de 1 minuto).');
  await registrar(feito, f.materia_id);
}
function atualizarRelogio() {
  const f = lerFoco(); const el = $('relogio');
  if (!f) { clearInterval(tick); tick = null; return; }
  const restante = f.restante != null ? f.restante : f.fim - Date.now();
  if (el) el.textContent = mmss(restante);
  const pg = $('anel-pg'); if (pg) pg.setAttribute('stroke-dashoffset', CIRC * (1 - Math.max(0, Math.min(1, restante / (f.total * 60000)))));
  if (f.restante == null && restante <= 0) pararFoco(true);
}

const CIRC = 2 * Math.PI * 45;
function chipsMat(sel) {
  return `<div class="chips-m" role="group" aria-label="Matéria"><button type="button" data-m="" aria-pressed="${sel === ''}"><i></i>Livre</button>${E.materias.map((m) => `<button type="button" data-m="${m.id}" aria-pressed="${String(m.id) === sel}" style="--c:${ES.CORES_MATERIA[m.cor]}"><i></i>${esc(m.nome)}</button>`).join('')}</div>`;
}
function abaFoco(w) {
  const f = lerFoco();
  const opcoesMat = '<option value="">Sem matéria</option>' + E.materias.map((m) => `<option value="${m.id}">${esc(m.nome)}</option>`).join('');
  if (f) {
    const m = f.materia_id && mat(f.materia_id);
    const cor = m ? ES.CORES_MATERIA[m.cor] : 'var(--accent)';
    const rest = f.restante != null ? f.restante : f.fim - Date.now();
    html(w, `<div class="es timer"><p class="sub" style="margin:0">${m ? esc(m.nome) : 'Foco livre'} · ${f.total} min</p><div class="anel-f" style="--c:${cor}"><svg viewBox="0 0 100 100" aria-hidden="true"><circle class="tr" cx="50" cy="50" r="45"/><circle class="pg" id="anel-pg" cx="50" cy="50" r="45" stroke-dasharray="${CIRC}" stroke-dashoffset="${CIRC * (1 - Math.max(0, Math.min(1, rest / (f.total * 60000))))}"/></svg><div class="ct"><div class="tempo" id="relogio">${mmss(rest)}</div><small>${f.restante != null ? 'Pausado' : 'Concentre-se. Celular longe.'}</small></div></div><div class="linhas" style="justify-content:center"><button class="btn2 pri" id="f-pausa">${f.restante != null ? 'Retomar' : 'Pausar'}</button><button class="btn2" id="f-parar">Parar e registrar</button></div></div>`);
    $('f-pausa').onclick = pausarFoco; $('f-parar').onclick = () => pararFoco(false);
    if (!tick) tick = setInterval(atualizarRelogio, 500);
  } else {
    if (!matSel) { const b = ES.agoraProximo(E.blocos, new Date()).atual; if (b && b.materia_id) matSel = String(b.materia_id); }
    const mSel = matSel && mat(Number(matSel));
    html(w, `<div class="es timer"><h3>Sessão de foco</h3><p class="sub">Escolha a matéria e a duração. Blocos curtos com pausa mantêm a atenção.</p>${chipsMat(matSel)}<div class="anel-f" style="--c:${mSel ? ES.CORES_MATERIA[mSel.cor] : 'var(--accent)'}"><svg viewBox="0 0 100 100" aria-hidden="true"><circle class="tr" cx="50" cy="50" r="45"/><circle class="pg" cx="50" cy="50" r="45" stroke-dasharray="${CIRC}" stroke-dashoffset="0"/></svg><div class="ct"><div class="tempo">${String(duracaoSel).padStart(2, '0')}:00</div><small>${mSel ? esc(mSel.nome) : 'sem matéria'}</small></div></div><div class="preset" role="group" aria-label="Duração">${[25, 50, 90].map((n) => `<button type="button" data-min="${n}" aria-pressed="${n === duracaoSel}">${n} min</button>`).join('')}</div><div class="linhas" style="justify-content:center"><button class="btn2 pri" id="f-ini" style="min-width:10rem">Iniciar</button></div></div>`);
    w.querySelectorAll('[data-m]').forEach((b) => { b.onclick = () => { matSel = b.dataset.m; desenhar(); }; });
    w.querySelectorAll('[data-min]').forEach((b) => { b.onclick = () => { duracaoSel = Number(b.dataset.min); desenhar(); }; });
    $('f-ini').onclick = iniciarFoco;
  }
  // estatísticas
  const st = ES.estatisticas(E, HOJE);
  const mx = Math.max(30, ...st.ultimos7.map((d) => d.min));
  html(w, `<div class="es"><h3>Últimos 7 dias</h3><p class="sub">Hoje ${ES.fmtMin(st.hoje)} · semana ${ES.fmtMin(st.semana)} · ${st.sequencia} ${st.sequencia === 1 ? 'dia' : 'dias'} seguidos</p><div class="mini">${st.ultimos7.map((d) => `<div><span>${d.min ? Math.round(d.min / 6) / 10 + 'h' : ''}</span><i data-ak="es-mini-${d.data}" data-eixo="height" data-pct="${(d.min / mx) * 70}" style="height:${(d.min / mx) * 70}%"></i><span>${ES.DIAS_CURTO[new Date(d.data + 'T12:00').getDay()]}</span></div>`).join('')}</div></div>`);
  const linhas = E.materias.map((m) => ({ m, min: st.porMateria.get(m.id) || 0 })).filter((x) => x.min || x.m.meta_h);
  const semMat = st.porMateria.get(null) || 0;
  html(w, `<div class="es"><h3>Por matéria (esta semana)</h3>${linhas.length || semMat ? '' : '<p class="vazio">Nenhum estudo registrado esta semana.</p>'}${linhas.map(({ m, min }) => { const alvo = m.meta_h * 60; const pct = alvo ? Math.min(100, (min / alvo) * 100) : Math.min(100, (min / Math.max(60, ...linhas.map((x) => x.min))) * 100); return `<div class="mrow"><span class="nm">${esc(m.nome)}</span><span class="b" style="--c:${ES.CORES_MATERIA[m.cor]}"><i data-ak="es-mat-${m.id}" data-pct="${pct}" style="width:${pct}%"></i></span><span class="v">${ES.fmtMin(min)}${alvo ? ' / ' + m.meta_h + ' h' : ''}</span></div>`; }).join('')}${semMat ? `<div class="mrow"><span class="nm">Sem matéria</span><span class="b"><i style="width:40%;opacity:.4"></i></span><span class="v">${ES.fmtMin(semMat)}</span></div>` : ''}</div>`);
  html(w, `<div class="es"><h3>Registrar tempo manualmente</h3><p class="sub">Estudou sem o cronômetro? Anote aqui.</p><div class="linha2" style="display:grid;grid-template-columns:1fr 6rem;gap:.5rem"><select id="mn-mat" aria-label="Matéria">${opcoesMat}</select><input id="mn-min" type="number" min="1" max="720" placeholder="min" aria-label="Minutos"></div><div class="linhas"><button class="btn2" id="mn-ok">Registrar</button></div></div>`);
  $('mn-ok').onclick = async () => { const n = Number($('mn-min').value); if (!(n >= 1 && n <= 720)) { aviso('Informe os minutos (1 a 720).', true); return; } await registrar(n, $('mn-mat').value ? Number($('mn-mat').value) : null); aviso('Tempo registrado.'); };
}

// ---------- cronograma personalizado (foto da rotina -> IA lê -> encaixo os estudos nos horários livres)
const cronOpt = { horas: null, sessao: 60, ini: '05:00', fim: '22:00', livres: [], foco: '', considerar: true, incluir: true, substituir: false };
const cron = { rotina: null, ignoradas: [], plano: null };
function horasPadrao() { try { const p = (window.BrainPrefs && window.BrainPrefs.get().perfil) || {}; const h = Number(p.horas) * Number(p.dias); if (h >= 1 && h <= 60) return Math.round(h); } catch (e) { /* sem perfil */ } return 10; }
const chaveIA = () => { try { return localStorage.getItem('brain-gemini-key') || ''; } catch (e) { return ''; } };
const optsHtml = (lista, atual) => lista.map(([v, t]) => `<option value="${v}"${String(v) === String(atual) ? ' selected' : ''}>${t}</option>`).join('');

function cartaoCronograma(w) {
  if (cronOpt.horas === null) cronOpt.horas = horasPadrao();
  const nBlocos = E.blocos.length;
  html(w, `<div class="es" id="cron-card"><h3>Cronograma com IA</h3>
    <p class="sub">Tire uma foto ou anexe a imagem da sua rotina (grade da escola, agenda, horário do trabalho). A IA lê os compromissos e eu encaixo os estudos nos horários livres, numa planilha que você pode baixar.</p>
    ${E.foto ? `<div class="cr-thumb"><img id="cr-img" src="${E.foto}" alt="Foto da sua rotina"><div>Foto da rotina guardada.<br><button class="linkb" id="cr-tirar-foto" type="button">Remover foto</button></div></div>` : ''}
    <div class="linhas"><label class="btn2 pri cr-b">${E.foto ? 'Tirar outra foto' : 'Tirar foto'}<input type="file" accept="image/*" capture="environment" id="cr-cam" hidden></label><label class="btn2 cr-b">${E.foto ? 'Anexar outra imagem' : 'Anexar imagem'}<input type="file" accept="image/*" id="cr-arq" hidden></label></div>
    <div class="cr-g">
      <label>Horas de estudo por semana<input type="number" id="cr-horas" min="1" max="60" inputmode="numeric" value="${cronOpt.horas}"></label>
      <label>Duração de cada sessão<select id="cr-sessao">${optsHtml([[45, '45 min'], [60, '1 hora'], [90, '1h30'], [120, '2 horas']], cronOpt.sessao)}</select></label>
      <label>Começar a partir de<select id="cr-ini">${optsHtml(['05:00', '06:00', '07:00', '08:00', '09:00'].map((h) => [h, h]), cronOpt.ini)}</select></label>
      <label>Terminar até<select id="cr-fim">${optsHtml(['19:00', '20:00', '21:00', '22:00', '23:00'].map((h) => [h, h]), cronOpt.fim)}</select></label>
    </div>
    <div class="cr-rot" id="cr-dl">Dias de descanso (sem estudo)</div>
    <div class="cr-dias" role="group" aria-labelledby="cr-dl">${ES.ORDEM_SEMANA.map((d) => `<button type="button" data-d="${d}" aria-pressed="${cronOpt.livres.includes(d)}" aria-label="${ES.DIAS[d]}">${ES.DIAS_CURTO[d].slice(0, 3)}</button>`).join('')}</div>
    <label class="cr-foco">Foco (opcional)<input id="cr-foco" maxlength="80" placeholder="Ex.: ENEM, Matemática, Redação" value="${esc(cronOpt.foco)}"></label>
    ${nBlocos ? `<label class="cr-ck"><input type="checkbox" id="cr-considerar"${cronOpt.considerar ? ' checked' : ''}> Respeitar também os blocos que já estão na minha semana (${nBlocos})</label>` : ''}
    <div style="border-top:1px solid var(--line);margin-top:1rem;padding-top:.8rem"><div class="cr-rot" style="margin-top:0">Chave grátis do Google (para a IA ler a foto)</div>
      <p class="sub" style="margin:.2rem 0 .5rem">Usa o Google Gemini com a sua própria chave, sem cartão. <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener noreferrer" style="color:var(--accent);font-weight:650">Pegar chave grátis</a>. Ela fica só neste aparelho e não entra no backup.</p>
      <input id="ia-chave" type="password" autocomplete="off" placeholder="Cole sua chave (AIza...)" value="${esc(chaveIA())}" aria-label="Chave da API do Google AI Studio">
      <p class="dica2" style="margin:.5rem 0 0">Privacidade: a imagem é enviada ao Google para ser lida. No plano gratuito o Google pode usar o conteúdo para melhorar seus produtos. Mande só o horário, sem dados pessoais.</p></div>
    <div class="linhas"><button class="btn2 pri" id="cr-montar" type="button">Montar cronograma</button></div>
    <div id="cr-status" class="dica2" role="status" aria-live="polite"></div>
    <div id="cr-saida"></div></div>`);
}

function lerOpcoes() {
  const v = (id) => { const e = $(id); return e ? e.value : null; };
  const h = Number(v('cr-horas')); if (h >= 1 && h <= 60) cronOpt.horas = Math.round(h);
  cronOpt.sessao = Number(v('cr-sessao')) || 60; cronOpt.ini = v('cr-ini') || '05:00'; cronOpt.fim = v('cr-fim') || '22:00';
  cronOpt.foco = (v('cr-foco') || '').slice(0, 80);
  const c = $('cr-considerar'); if (c) cronOpt.considerar = c.checked;
  cronOpt.livres = [...document.querySelectorAll('.cr-dias [aria-pressed="true"]')].map((b) => Number(b.dataset.d));
}

async function novaFotoRotina(f) {
  if (!f) return;
  try { E.foto = await reduzirFoto(f); cron.rotina = null; cron.plano = null; await salvar(); aviso('Foto guardada. Toque em "Montar cronograma".'); }
  catch (err) { aviso('Não consegui usar essa imagem.', true); }
}

function ligarCronograma(w) {
  const card = $('cron-card'); if (!card) return;
  $('cr-cam').onchange = (ev) => { const f = ev.target.files[0]; ev.target.value = ''; lerOpcoes(); novaFotoRotina(f); };
  $('cr-arq').onchange = (ev) => { const f = ev.target.files[0]; ev.target.value = ''; lerOpcoes(); novaFotoRotina(f); };
  const img = $('cr-img'); if (img) img.onclick = () => { $('foto-grande').src = E.foto; $('foto-grande').classList.remove('grande'); $('dlg-foto').showModal(); };
  const rm = $('cr-tirar-foto'); if (rm) rm.onclick = async () => { lerOpcoes(); E.foto = null; cron.rotina = null; cron.plano = null; await salvar(); };
  card.querySelectorAll('.cr-dias button').forEach((b) => { b.onclick = () => { b.setAttribute('aria-pressed', String(b.getAttribute('aria-pressed') !== 'true')); lerOpcoes(); }; });
  card.querySelectorAll('input, select').forEach((el) => { if (el.type !== 'file' && el.id !== 'ia-chave') el.addEventListener('change', lerOpcoes); });
  $('ia-chave').oninput = () => { try { localStorage.setItem('brain-gemini-key', $('ia-chave').value.trim()); } catch (e) { /* sem storage */ } };
  $('cr-montar').onclick = montarCron;
  if (cron.plano) desenharCron();
}

async function montarCron() {
  const st = $('cr-status'), btn = $('cr-montar');
  lerOpcoes();
  const chave = $('ia-chave').value.trim();
  try { localStorage.setItem('brain-gemini-key', chave); } catch (e) { /* sem storage */ }
  btn.disabled = true;
  try {
    if (E.foto && !cron.rotina) {
      if (chave.length < 20) { st.textContent = 'Cole sua chave grátis do Google acima para a IA ler a foto.'; $('ia-chave').focus(); return; }
      st.textContent = 'A IA está lendo a foto... pode levar alguns segundos.';
      const r = await BrainLeitor.lerFoto({ chave, imagem: E.foto, materias: E.materias });
      cron.rotina = r.blocos; cron.ignoradas = r.ignoradas;
      if (!r.blocos.length) { st.textContent = 'A IA não encontrou compromissos nessa foto. Tente uma foto mais nítida, de frente e com boa luz.'; return; }
    }
    let fixos = (cron.rotina || []).slice();
    if (cronOpt.considerar && E.blocos.length) fixos = fixos.concat(E.blocos);
    const plano = ES.montarCronograma(fixos, {
      horasSemana: cronOpt.horas, sessaoMin: cronOpt.sessao, janelaIni: cronOpt.ini, janelaFim: cronOpt.fim, diasLivres: cronOpt.livres,
      foco: cronOpt.foco.split(/[,;]/).map((x) => x.trim()).filter(Boolean), materias: E.materias,
    });
    cron.plano = { ...plano, rotina: cron.rotina || [], semFoto: !cron.rotina };
    st.textContent = cron.rotina ? `A IA leu ${cron.rotina.length} compromissos da foto.${cron.ignoradas.length ? ` ${cron.ignoradas.length} não deu para entender.` : ''}` : (fixos.length ? 'Usei os blocos que já estão na sua semana.' : 'Sem foto nem blocos, usei a semana toda livre. Anexe a foto da sua rotina para um plano sob medida.');
    desenharCron();
    const o = $('cr-saida'); if (o) o.scrollIntoView({ behavior: 'smooth', block: 'start' });
  } catch (err) { st.textContent = err.message || 'Não consegui montar agora.'; }
  finally { btn.disabled = false; }
}

function celulaGrade(b) {
  if (b.tipo === 'estudo') {
    const m = b.materia_id ? E.materias.find((x) => x.id === b.materia_id) : E.materias.find((x) => ES.norm(x.nome) === ES.norm(b.titulo));
    const cor = m ? ES.CORES_MATERIA[m.cor % ES.CORES_MATERIA.length] : (b.titulo === 'Revisão da semana' ? '#5f6b7a' : ES.CORES_MATERIA[Math.abs([...b.titulo].reduce((a, c) => a + c.charCodeAt(0), 0)) % ES.CORES_MATERIA.length]);
    return { cls: 'e', style: `background:${cor}` };
  }
  return { cls: 'f', style: '' };
}

function tabelaCron(blocos) {
  const g = ES.grade(blocos);
  const skip = g.dias.map(() => 0);
  let h = '<table class="planilha"><thead><tr><th scope="col">Hora</th>' + g.dias.map((d) => `<th scope="col">${ES.DIAS_CURTO[d]}</th>`).join('') + '</tr></thead><tbody>';
  g.linhas.forEach((l, r) => {
    h += `<tr><td class="h">${l.hora}</td>`;
    l.celulas.forEach((b, c) => {
      if (skip[c] > 0) { skip[c]--; return; }
      if (!b) { h += '<td></td>'; return; }
      let n = 1; while (g.linhas[r + n] && g.linhas[r + n].celulas[c] === b) n++;
      skip[c] = n - 1;
      const k = celulaGrade(b);
      h += `<td class="${k.cls}" rowspan="${n}" style="${k.style}">${esc(b.titulo)}${b.tipo === 'estudo' ? `<small>${b.ini}–${b.fim}</small>` : ''}</td>`;
    });
    h += '</tr>';
  });
  return h + '</tbody></table>';
}

function desenharCron() {
  const p = cron.plano, o = $('cr-saida'); if (!p || !o) return;
  const todos = p.rotina.concat(cronOpt.considerar ? E.blocos.filter((b) => b.tipo !== 'estudo') : []).concat(p.blocos);
  const nomes = Object.entries(p.resumo.porMateria).sort((a, b) => b[1] - a[1]);
  o.innerHTML = `<h4>Seu cronograma</h4>
    ${p.avisos.map((a) => `<div class="aviso2">${esc(a)}</div>`).join('')}
    ${p.blocos.length ? `<p class="sub" style="margin:.2rem 0">${p.blocos.length} sessões, ${ES.fmtMin(p.resumo.minutos)} por semana. Cinza = seus compromissos; colorido = estudo.</p>
    <div class="cr-res">${nomes.map(([n, m]) => `<span class="chip">${esc(n)} · ${ES.fmtMin(m)}</span>`).join('')}</div>
    <div class="planilha-w" tabindex="0" role="region" aria-label="Planilha do cronograma">${tabelaCron(todos)}</div>
    ${p.rotina.length ? '<label class="cr-ck"><input type="checkbox" id="cr-incl" checked> Adicionar também os compromissos lidos da foto à minha semana</label>' : ''}
    ${E.blocos.some((b) => b.tipo === 'estudo') ? '<label class="cr-ck"><input type="checkbox" id="cr-subst"> Substituir os blocos de estudo que já tenho</label>' : ''}
    <div class="linhas"><button class="btn2 pri" id="cr-aplicar" type="button">Adicionar à minha semana</button><button class="btn2" id="cr-baixar" type="button">Baixar planilha</button><button class="btn2" id="cr-copiar" type="button">Copiar para o Sheets</button></div>
    <div id="cr-msg" class="dica2" role="status" aria-live="polite"></div>` : ''}`;
  const msg = (t) => { const e = $('cr-msg'); if (e) e.textContent = t; };
  const a = $('cr-aplicar'); if (a) a.onclick = async () => {
    const incl = $('cr-incl') ? $('cr-incl').checked : false, subst = $('cr-subst') ? $('cr-subst').checked : false;
    if (subst) E.blocos = E.blocos.filter((b) => b.tipo !== 'estudo');
    const idDe = (nome) => { let m = E.materias.find((x) => ES.norm(x.nome) === ES.norm(nome)); if (!m) { m = { id: ES.novoId(E), nome, cor: E.materias.length % ES.CORES_MATERIA.length, prioridade: 2, meta_h: 0 }; E.materias.push(m); } return m.id; };
    const igual = (x, y) => x.dia === y.dia && x.ini === y.ini && x.fim === y.fim && ES.norm(x.titulo) === ES.norm(y.titulo);
    let n = 0;
    if (incl) for (const b of p.rotina) if (!E.blocos.some((x) => igual(x, b))) { E.blocos.push({ id: ES.novoId(E), dia: b.dia, ini: b.ini, fim: b.fim, titulo: b.titulo, tipo: b.tipo, materia_id: null }); n++; }
    for (const b of p.blocos) { E.blocos.push({ id: ES.novoId(E), dia: b.dia, ini: b.ini, fim: b.fim, titulo: b.titulo, tipo: 'estudo', materia_id: b.nome ? idDe(b.nome) : null }); n++; }
    cron.plano = null; cron.rotina = null;
    await salvar(); aviso(`${n} blocos adicionados. Veja na aba Semana.`); aba = 'semana'; desenhar();
  };
  const nome = `cronograma-de-estudos-${HOJE}.csv`;
  const b = $('cr-baixar'); if (b) b.onclick = async () => {
    const blob = new Blob([ES.planilhaTexto(todos)], { type: 'text/csv;charset=utf-8' });
    try { const f = new File([blob], nome, { type: 'text/csv' }); if (navigator.canShare && navigator.canShare({ files: [f] })) { await navigator.share({ files: [f], title: 'Cronograma de estudos' }); msg('Planilha pronta. Abra no Excel ou no Google Sheets.'); return; } }
    catch (e) { if (e && e.name === 'AbortError') { msg('Compartilhamento cancelado.'); return; } }
    try { const l = document.createElement('a'); l.href = URL.createObjectURL(blob); l.download = nome; document.body.append(l); l.click(); l.remove(); setTimeout(() => URL.revokeObjectURL(l.href), 60000); msg('Planilha baixada. Confira em Downloads e abra no Excel ou no Google Sheets.'); }
    catch (e) { msg('Não consegui baixar. Use "Copiar para o Sheets".'); }
  };
  const c = $('cr-copiar'); if (c) c.onclick = async () => {
    try { await navigator.clipboard.writeText(ES.planilhaTexto(todos, 'tsv')); msg('Copiado. Abra o Google Sheets e cole na célula A1.'); }
    catch (e) { msg('O navegador não deixou copiar. Use "Baixar planilha".'); }
  };
}

function mostrarPrevia() {
  const el = $('previa'); if (!el || !previa) return;
  const n = previa.blocos.length;
  el.innerHTML = `${n ? `<p class="sub" style="margin:.6rem 0 .2rem">Entendi ${n} ${n === 1 ? 'bloco' : 'blocos'}${previa.origem === 'ia' ? ' (lidos por IA: confira horários e títulos antes de adicionar)' : ''}:</p><div class="previa">${previa.blocos.slice(0, 80).map((b) => `<div>${ES.DIAS_CURTO[b.dia]} ${b.ini}-${b.fim} · ${esc(b.titulo)} <span class="chip">${ES.TIPOS[b.tipo]}</span></div>`).join('')}${n > 80 ? `<div>... e mais ${n - 80}</div>` : ''}</div>` : '<div class="aviso2">Não consegui entender nenhuma linha. Use o formato: dias, horário e atividade. Ex.: "seg a sex 05:00-06:00 física".</div>'}${previa.ignoradas.length ? `<div class="aviso2">Não entendi: ${previa.ignoradas.slice(0, 4).map(esc).join(' | ')}${previa.ignoradas.length > 4 ? ' ...' : ''}</div>` : ''}${n ? `<div class="linhas"><button class="btn2 pri" id="aplicar-add">Adicionar à semana</button>${E.blocos.length ? '<button class="btn2" id="aplicar-sub">Substituir tudo</button>' : ''}</div>` : ''}`;
  const aplicar = async (substituir) => {
    if (substituir && !confirm('Substituir todos os blocos atuais pelos novos?')) return;
    if (substituir) E.blocos = [];
    previa.blocos.forEach((b) => E.blocos.push({ id: ES.novoId(E), dia: b.dia, ini: b.ini, fim: b.fim, titulo: b.titulo, tipo: b.tipo, materia_id: b.materia_id || null }));
    const n2 = previa.blocos.length; previa = null; await salvar(); aviso(`${n2} blocos adicionados. Veja na aba Semana.`); aba = 'semana'; desenhar();
  };
  const a1 = $('aplicar-add'); if (a1) a1.onclick = () => aplicar(false);
  const a2 = $('aplicar-sub'); if (a2) a2.onclick = () => aplicar(true);
}

function reduzirFoto(arquivo) {
  return new Promise((ok, no) => {
    const url = URL.createObjectURL(arquivo); const img = new Image();
    img.onload = () => {
      URL.revokeObjectURL(url);
      let larg = Math.min(1500, img.width), q = 0.72, dados = '';
      for (let i = 0; i < 5; i++) {
        const c = document.createElement('canvas'); c.width = larg; c.height = Math.round(img.height * (larg / img.width));
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        dados = c.toDataURL('image/jpeg', q);
        if (dados.length <= 600000) return ok(dados);
        larg = Math.round(larg * 0.8); q = Math.max(0.5, q - 0.06);
      }
      no(new Error('grande demais'));
    };
    img.onerror = () => { URL.revokeObjectURL(url); no(new Error('imagem inválida')); };
    img.src = url;
  });
}
$('foto-fechar').onclick = () => $('dlg-foto').close();
$('foto-grande').onclick = (e) => e.target.classList.toggle('grande');

// vestibular e matéria (diálogos)
let editVest = null, editMat = null;
function abrirVest(x) { editVest = x; $('v-nome').value = x ? x.nome : ''; $('v-data').value = x ? x.data : ''; $('v-foco').checked = x ? x.foco : !E.vestibulares.length; $('v-apagar').hidden = !x; $('dlg-vest').showModal(); }
$('v-cancelar').onclick = () => $('dlg-vest').close();
$('v-apagar').onclick = async () => { if (!editVest || !confirm('Apagar?')) return; E.vestibulares = E.vestibulares.filter((y) => y.id !== editVest.id); $('dlg-vest').close(); await salvar(); };
$('f-vest').addEventListener('submit', async (e) => { e.preventDefault(); const d = { nome: $('v-nome').value.trim(), data: $('v-data').value, foco: $('v-foco').checked }; if (d.foco) E.vestibulares.forEach((y) => { y.foco = false; }); if (editVest) Object.assign(editVest, d); else E.vestibulares.push({ id: ES.novoId(E), ...d }); $('dlg-vest').close(); await salvar(); });
function abrirMat(m) { editMat = m; $('m-nome').value = m ? m.nome : ''; $('m-prio').value = String(m ? m.prioridade : 2); $('m-meta').value = m ? m.meta_h : 0; $('m-apagar').hidden = !m; $('dlg-mat').showModal(); }
$('m-cancelar').onclick = () => $('dlg-mat').close();
$('m-apagar').onclick = async () => { if (!editMat || !confirm('Apagar esta matéria? Os blocos continuam, sem matéria.')) return; E.materias = E.materias.filter((y) => y.id !== editMat.id); $('dlg-mat').close(); await salvar(); };
$('f-mat').addEventListener('submit', async (e) => { e.preventDefault(); const d = { nome: $('m-nome').value.trim(), prioridade: Number($('m-prio').value), meta_h: Number($('m-meta').value) || 0 }; if (editMat) Object.assign(editMat, d); else E.materias.push({ id: ES.novoId(E), cor: E.materias.length % ES.CORES_MATERIA.length, ...d }); $('dlg-mat').close(); await salvar(); });

function ligar(w) {
  w.querySelectorAll('[data-ir]').forEach((b) => { b.onclick = () => { aba = b.dataset.ir; desenhar(); }; });
  w.querySelectorAll('[data-foco]').forEach((b) => { b.onclick = () => { matSel = b.dataset.foco; aba = 'foco'; desenhar(); }; });
  const um = $('usar-foto'); if (um) um.onclick = () => { aba = 'plano'; desenhar(); const c = $('cron-card'); if (c) c.scrollIntoView({ block: 'start' }); };
}
window.addEventListener('pagehide', () => { clearInterval(tick); });
if (lerFoco()) aba = 'foco';
carregar();
